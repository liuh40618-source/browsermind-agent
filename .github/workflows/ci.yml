# BrowserMind CI：每次 push / PR 自动跑静态检查 + 单元测试
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff mypy

      - name: Ruff lint (F rules)
        run: ruff check .

      - name: Type check configuration and entrypoint
        run: mypy main.py

      - name: Run unit tests
        run: pytest tests/ -v

  # 冒烟：确保 FastAPI 应用可导入、/api/health 可访问
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 无浏览器也可验证导入与健康检查（浏览器在 lifespan 中启动）
          python -c "import main; print('main import OK')"
