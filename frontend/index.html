<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrowserMind — Autonomous AI Agent</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="dns-prefetch" href="https://unpkg.com">
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/marked@15.0.7/marked.min.js" crossorigin></script>
<script src="https://unpkg.com/dompurify@3.2.4/dist/purify.min.js" crossorigin></script>
<style>
/* ══════════════════════════════════════════════════
   BrowserMind — Premium Dark AI Workspace
   Inspired by: ChatGPT × Cursor Agent × Perplexity
   ══════════════════════════════════════════════════ */

:root {
  /* ── Core palette: deep space navy ── */
  --bg-deep: #06080f;
  --bg-base: #0a0e1a;
  --bg-surface: #0f1424;
  --bg-elevated: #141a2e;
  --bg-hover: #1a2140;

  /* ── Glass ── */
  --glass-bg: rgba(15, 20, 40, 0.65);
  --glass-border: rgba(120, 130, 180, 0.12);
  --glass-highlight: rgba(255, 255, 255, 0.04);

  /* ── Text ── */
  --text-primary: #e8ecf4;
  --text-secondary: #8b93a8;
  --text-muted: #525b73;
  --text-dim: #353d50;

  /* ── Accent: purple-blue neon ── */
  --neon-purple: #8b5cf6;
  --neon-blue: #3b82f6;
  --neon-cyan: #06b6d4;
  --neon-pink: #ec4899;
  --neon-green: #10b981;
  --neon-amber: #f59e0b;
  --neon-red: #ef4444;

  /* ── Glow ── */
  --glow-purple: 0 0 20px rgba(139, 92, 246, 0.3), 0 0 60px rgba(139, 92, 246, 0.1);
  --glow-blue: 0 0 20px rgba(59, 130, 246, 0.3), 0 0 60px rgba(59, 130, 246, 0.1);
  --glow-green: 0 0 20px rgba(16, 185, 129, 0.3);
  --glow-amber: 0 0 20px rgba(245, 158, 11, 0.3);

  /* ── Geometry ── */
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;

  /* ── Typography ── */
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

  /* ── Common patterns ── */
  --gradient-primary: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  --glass-blur: blur(16px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Ambient background ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 10%, rgba(139, 92, 246, 0.06) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(59, 130, 246, 0.04) 0%, transparent 60%),
    radial-gradient(ellipse 50% 50% at 50% 50%, rgba(6, 8, 15, 0.8) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════════════
   App Shell
   ══════════════════════════════════════════════ */
.app {
  display: flex;
  height: 100vh;
  position: relative;
  z-index: 1;
}

/* ══════════════════════════════════════════════
   LEFT SIDEBAR — Navigation + Recent Tasks
   ══════════════════════════════════════════════ */
.sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--bg-base);
  border-right: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
  padding: 0;
  position: relative;
  overflow: hidden;
}

.sidebar::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, var(--neon-purple) 0%, transparent 30%, transparent 70%, var(--neon-blue) 100%);
  opacity: 0.3;
}

/* Logo area */
.sidebar-brand {
  padding: 20px 20px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--glass-border);
}

.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--gradient-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  box-shadow: var(--glow-purple);
  position: relative;
}

.brand-icon::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 12px;
  background: var(--gradient-primary);
  opacity: 0.3;
  filter: blur(8px);
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-size: 16px;
  font-weight: 800;
  background: linear-gradient(135deg, #e8ecf4, #8b93a8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.3px;
}

.brand-version {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* New Task button */
.new-task-btn {
  margin: 16px 16px 8px;
  padding: 11px 16px;
  background: var(--gradient-primary);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.new-task-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
  opacity: 0;
  transition: opacity 0.2s;
}

.new-task-btn:hover::before { opacity: 1; }
.new-task-btn:hover { transform: translateY(-1px); box-shadow: var(--glow-purple); }

/* Navigation */
.sidebar-nav {
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: var(--font);
}

.nav-item:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.nav-item.active {
  background: rgba(139, 92, 246, 0.12);
  color: var(--neon-purple);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0;
  width: 3px;
  height: 20px;
  background: var(--neon-purple);
  border-radius: 0 2px 2px 0;
}

.nav-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  opacity: 0.7;
}

.nav-item.active .nav-icon { opacity: 1; }

/* Sidebar divider */
.sidebar-divider {
  height: 1px;
  background: var(--glass-border);
  margin: 8px 16px;
}

/* Recent tasks in sidebar */
.sidebar-section-title {
  padding: 8px 20px 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.2px;
}

.sidebar-tasks {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px 10px;
}

.sidebar-task-item {
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 2px;
}

.sidebar-task-item:hover {
  background: var(--bg-hover);
}

.sidebar-task-title {
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
}

.sidebar-task-meta {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sidebar-task-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

/* Model selector in sidebar */
.sidebar-model {
  margin: auto 10px 10px;
  padding: 10px 12px;
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.15s;
}

.sidebar-model:hover {
  border-color: var(--neon-purple);
  background: var(--bg-elevated);
}

.model-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
  animation: breathe 2s ease-in-out infinite;
}

.model-dot.unconfigured {
  background: var(--text-muted);
  box-shadow: none;
  animation: none;
}

@keyframes breathe {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.85); }
}

.model-info {
  flex: 1;
  min-width: 0;
}

.model-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.model-provider {
  font-size: 10px;
  color: var(--text-muted);
}

/* ══════════════════════════════════════════════
   CENTER — Main Workspace
   ══════════════════════════════════════════════ */
.workspace {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
  overflow: hidden;
}

/* Task Header Card */
.task-header {
  padding: 20px 28px 16px;
  border-bottom: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.task-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.5;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.task-meta-row {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.task-progress-wrap {
  flex: 1;
  min-width: 200px;
}

.task-progress-bar {
  height: 4px;
  background: var(--bg-hover);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.task-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
  border-radius: 2px;
  transition: width 0.5s ease;
  position: relative;
}

.task-progress-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: -2px;
  bottom: -2px;
  width: 20px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
  animation: progressShine 1.5s ease-in-out infinite;
}

@keyframes progressShine {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}

.task-meta-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.meta-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 500;
}

.meta-chip .chip-icon {
  font-size: 12px;
}

.meta-chip.active {
  border-color: var(--neon-purple);
  color: var(--neon-purple);
  background: rgba(139, 92, 246, 0.08);
}

/* ══════════════════════════════════════════════
   Agent Execution Timeline — AI Thinking Process
   ══════════════════════════════════════════════ */
.timeline-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 28px;
  scroll-behavior: smooth;
}

.timeline-area::-webkit-scrollbar { width: 4px; }
.timeline-area::-webkit-scrollbar-track { background: transparent; }
.timeline-area::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }

/* Timeline spine */
.timeline-spine {
  position: relative;
  padding-left: 32px;
}

.timeline-spine::before {
  content: '';
  position: absolute;
  left: 11px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(180deg,
    var(--neon-purple) 0%,
    var(--neon-blue) 30%,
    var(--glass-border) 60%,
    transparent 100%
  );
  border-radius: 1px;
}

/* Timeline node — base */
.tl-node {
  position: relative;
  margin-bottom: 16px;
  animation: nodeSlideIn 0.3s ease;
}

@keyframes nodeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Node dot on spine */
.tl-dot {
  position: absolute;
  left: -32px;
  top: 12px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  z-index: 2;
}

.tl-dot::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  opacity: 0.3;
  animation: dotPulse 2s ease-in-out infinite;
}

@keyframes dotPulse {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.3); opacity: 0.1; }
}

/* Node type colors */
.tl-dot.thinking {
  background: var(--neon-purple);
  box-shadow: var(--glow-purple);
}
.tl-dot.thinking::before { background: var(--neon-purple); }

.tl-dot.searching {
  background: var(--neon-blue);
  box-shadow: var(--glow-blue);
}
.tl-dot.searching::before { background: var(--neon-blue); }

.tl-dot.extracting {
  background: var(--neon-green);
  box-shadow: var(--glow-green);
}
.tl-dot.extracting::before { background: var(--neon-green); }

.tl-dot.analyzing {
  background: var(--neon-amber);
  box-shadow: var(--glow-amber);
}
.tl-dot.analyzing::before { background: var(--neon-amber); }

.tl-dot.reflecting {
  background: var(--neon-pink);
  box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
}
.tl-dot.reflecting::before { background: var(--neon-pink); }

.tl-dot.system {
  background: var(--text-muted);
  box-shadow: none;
}
.tl-dot.system::before { background: transparent; animation: none; }

/* Node card */
.tl-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 14px 18px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.2s;
}

.tl-card:hover {
  border-color: rgba(139, 92, 246, 0.2);
  background: var(--bg-elevated);
}

.tl-card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.tl-agent-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
}

.tl-agent-badge.thinking { background: rgba(139,92,246,0.15); color: var(--neon-purple); }
.tl-agent-badge.searching { background: rgba(59,130,246,0.15); color: var(--neon-blue); }
.tl-agent-badge.extracting { background: rgba(16,185,129,0.15); color: var(--neon-green); }
.tl-agent-badge.analyzing { background: rgba(245,158,11,0.15); color: var(--neon-amber); }
.tl-agent-badge.reflecting { background: rgba(236,72,153,0.15); color: var(--neon-pink); }
.tl-agent-badge.system { background: rgba(82,91,115,0.15); color: var(--text-muted); }

.tl-time {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  margin-left: auto;
}

.tl-action {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.5;
}

.tl-detail {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
  line-height: 1.6;
  word-break: break-all;
  padding: 8px 10px;
  background: rgba(0,0,0,0.2);
  border-radius: var(--radius-sm);
  border-left: 2px solid var(--glass-border);
}

/* ══════════════════════════════════════════════
   Reflection Node — Core Animation
   ══════════════════════════════════════════════ */
.reflection-card {
  background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(59,130,246,0.05));
  border: 1px solid rgba(139, 92, 246, 0.25);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}

.reflection-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue), var(--neon-pink));
  animation: reflectionShimmer 3s linear infinite;
}

@keyframes reflectionShimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.reflection-card.latest {
  border-color: var(--neon-purple);
  box-shadow: var(--glow-purple);
}

.reflection-card.latest::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at top, rgba(139,92,246,0.08), transparent 70%);
  pointer-events: none;
}

.refl-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.refl-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.refl-icon {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
  animation: reflBreathe 2.5s ease-in-out infinite;
}

@keyframes reflBreathe {
  0%, 100% { box-shadow: 0 0 12px rgba(139, 92, 246, 0.3); }
  50% { box-shadow: 0 0 24px rgba(139, 92, 246, 0.5); }
}

.refl-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--neon-purple);
}

.refl-score {
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 800;
  background: var(--gradient-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.refl-score.success {
  background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.refl-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.refl-reason {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.refl-missing {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 8px 12px;
  background: rgba(245, 158, 11, 0.08);
  border: 1px solid rgba(245, 158, 11, 0.15);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--neon-amber);
  line-height: 1.5;
}

.refl-next {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 8px 12px;
  background: rgba(139, 92, 246, 0.08);
  border: 1px solid rgba(139, 92, 246, 0.15);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--neon-purple);
  line-height: 1.5;
}

.refl-bar {
  width: 100%;
  height: 4px;
  background: var(--bg-hover);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}

.refl-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-purple), var(--neon-blue));
  border-radius: 2px;
  transition: width 0.6s ease;
}

/* Reflection decision buttons */
.refl-decision {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--glass-border);
}

.refl-btn {
  flex: 1;
  padding: 8px 14px;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.refl-btn.continue {
  background: var(--gradient-primary);
  color: #fff;
}

.refl-btn.continue:hover {
  transform: translateY(-1px);
  box-shadow: var(--glow-purple);
}

.refl-btn.stop {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--glass-border);
}

.refl-btn.stop:hover {
  border-color: var(--neon-red);
  color: var(--neon-red);
}

/* ══════════════════════════════════════════════
   Chat Input — Bottom
   ══════════════════════════════════════════════ */
.chat-input-area {
  padding: 16px 28px 20px;
  border-top: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.chat-input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 10px 14px;
  transition: border-color 0.2s;
}

.chat-input-wrap:focus-within {
  border-color: var(--neon-purple);
  box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
}

.chat-input {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font);
  resize: none;
  outline: none;
  min-height: 20px;
  max-height: 100px;
  line-height: 1.5;
}

.chat-input::placeholder { color: var(--text-dim); }

.chat-send-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--gradient-primary);
  border: none;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.chat-send-btn:hover { transform: scale(1.05); box-shadow: var(--glow-purple); }
.chat-send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

/* Quick actions */
.quick-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.quick-action-btn {
  padding: 4px 10px;
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  color: var(--text-muted);
  font-size: 11px;
  font-family: var(--font);
  cursor: pointer;
  transition: all 0.15s;
}

.quick-action-btn:hover {
  border-color: var(--neon-purple);
  color: var(--neon-purple);
  background: rgba(139, 92, 246, 0.06);
}

/* ══════════════════════════════════════════════
   RIGHT PANEL — Intelligence Panel
   ══════════════════════════════════════════════ */
.intel-panel-wrapper {
  position: relative;
  flex-shrink: 0;
  display: flex;
}

.intel-panel {
  width: 320px;
  min-width: 240px;
  max-width: 70vw;
  background: var(--bg-base);
  border-left: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
}

.intel-panel::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, var(--neon-blue) 0%, transparent 30%, transparent 70%, var(--neon-purple) 100%);
  opacity: 0.2;
  z-index: 1;
  pointer-events: none;
}

/* 拖拽调整宽度手柄 */
.intel-resize-handle {
  position: absolute;
  top: 0;
  left: -4px;
  bottom: 0;
  width: 8px;
  cursor: col-resize;
  z-index: 200;
  transition: all 0.15s;
}
.intel-resize-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 3px;
  height: 32px;
  border-radius: 2px;
  background: var(--text-dim);
  opacity: 0;
  transition: opacity 0.2s;
}
.intel-resize-handle:hover::after,
.intel-resize-handle.active::after {
  opacity: 0.6;
  background: var(--neon-purple);
}
.intel-resize-handle:hover,
.intel-resize-handle.active {
  background: linear-gradient(180deg, rgba(124,58,237,0.08), rgba(59,130,246,0.08));
}
body.resizing-panel {
  cursor: col-resize !important;
  user-select: none !important;
}
body.resizing-panel * {
  cursor: col-resize !important;
}

/* 报告区域垂直拖拽手柄 */
.report-resize-handle {
  position: relative;
  height: 8px;
  cursor: row-resize;
  flex-shrink: 0;
  z-index: 10;
  transition: background 0.15s;
}
.report-resize-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 32px;
  height: 3px;
  border-radius: 2px;
  background: var(--text-dim);
  opacity: 0;
  transition: opacity 0.2s;
}
.report-resize-handle:hover::after,
.report-resize-handle.active::after {
  opacity: 0.6;
  background: var(--neon-purple);
}
.report-resize-handle:hover,
.report-resize-handle.active {
  background: linear-gradient(90deg, transparent, rgba(124,58,237,0.08), transparent);
}
body.resizing-report {
  cursor: row-resize !important;
  user-select: none !important;
}
body.resizing-report * {
  cursor: row-resize !important;
}

.intel-section {
  padding: 10px 14px;
  border-bottom: 1px solid var(--glass-border);
  position: relative;
  min-height: 40px;
  overflow: hidden;
}

.section-resize-handle {
  position: relative;
  height: 8px;
  cursor: row-resize;
  flex-shrink: 0;
  z-index: 10;
  transition: background 0.15s;
}

.section-resize-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 24px;
  height: 2px;
  border-radius: 1px;
  background: var(--text-dim);
  opacity: 0;
  transition: opacity 0.2s;
}

.section-resize-handle:hover::after,
.section-resize-handle.active::after {
  opacity: 0.6;
  background: var(--neon-purple);
}

.section-resize-handle:hover,
.section-resize-handle.active {
  background: linear-gradient(90deg, transparent, rgba(124,58,237,0.08), transparent);
}

body.resizing-section {
  cursor: row-resize !important;
  user-select: none !important;
}

body.resizing-section * {
  cursor: row-resize !important;
}

.intel-section:not(:last-child) .section-resize-handle {
  position: absolute;
  bottom: -4px;
  left: 10%;
  right: 10%;
  height: 8px;
  cursor: row-resize;
  z-index: 10;
  border-radius: 4px;
  transition: all 0.15s;
}

.intel-section:not(:last-child) .section-resize-handle:hover,
.intel-section:not(:last-child) .section-resize-handle.active {
  background: linear-gradient(90deg, transparent, rgba(139,92,246,0.15), transparent);
}

.intel-section:not(:last-child) .section-resize-handle::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 24px;
  height: 2px;
  border-radius: 1px;
  background: var(--text-dim);
  opacity: 0;
  transition: opacity 0.2s;
}

.intel-section:not(:last-child) .section-resize-handle:hover::after,
.intel-section:not(:last-child) .section-resize-handle.active::after {
  opacity: 0.6;
  background: var(--neon-purple);
}

body.resizing-section {
  cursor: row-resize !important;
  user-select: none !important;
}

.intel-section-title {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.intel-section-title .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--neon-purple);
}

/* Task overview stats */
.overview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.overview-item {
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 8px 10px;
  transition: all 0.2s;
}

.overview-item:hover {
  border-color: rgba(139, 92, 246, 0.2);
}

.overview-item.active {
  border-color: var(--neon-purple);
  background: rgba(139, 92, 246, 0.06);
}

.overview-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.overview-value {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-primary);
  font-family: var(--mono);
}

.overview-value span {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 2px;
}

.overview-hint {
  font-size: 10px;
  color: var(--text-dim);
  margin-top: 2px;
}

/* Task tree */
.task-tree {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.tree-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--text-secondary);
  transition: all 0.15s;
}

.tree-item:hover { background: var(--bg-hover); }

.tree-icon {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
}

.tree-icon.done { background: rgba(16,185,129,0.15); color: var(--neon-green); }
.tree-icon.running { background: rgba(139,92,246,0.15); color: var(--neon-purple); animation: breathe 1.5s ease-in-out infinite; }
.tree-icon.pending { background: var(--bg-hover); color: var(--text-dim); }

.tree-item.done { color: var(--text-muted); }
.tree-item.running { color: var(--text-primary); font-weight: 600; }

/* Data sources */
.source-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.source-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: var(--text-secondary);
  transition: all 0.15s;
  text-decoration: none;
}

.source-chip:hover {
  background: var(--bg-hover);
  color: var(--text-primary);
}

.source-favicon {
  width: 16px;
  height: 16px;
  border-radius: 3px;
  background: var(--bg-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.source-domain {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--neon-blue);
}

/* ══════════════════════════════════════════════
   Report Generation Process — Perplexity Style
   ══════════════════════════════════════════════ */
.report-gen {
  display: flex;
  flex-direction: column;
  gap: 0;
}

.report-gen-step {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
  position: relative;
}

.report-gen-step::before {
  content: '';
  position: absolute;
  left: 9px;
  top: 22px;
  bottom: -5px;
  width: 1px;
  background: var(--glass-border);
}

.report-gen-step:last-child::before { display: none; }

.rg-icon {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

.rg-icon.done {
  background: var(--neon-green);
  color: #fff;
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
}

.rg-icon.active {
  background: var(--neon-purple);
  color: #fff;
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
  animation: rgPulse 1.5s ease-in-out infinite;
}

.rg-icon.waiting {
  background: var(--bg-hover);
  color: var(--text-dim);
}

@keyframes rgPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(139, 92, 246, 0.4); }
  50% { box-shadow: 0 0 24px rgba(139, 92, 246, 0.6); }
}

.rg-text {
  font-size: 12px;
  color: var(--text-secondary);
}

.rg-text.done { color: var(--text-muted); }
.rg-text.active { color: var(--text-primary); font-weight: 600; }

/* ══════════════════════════════════════════════
   Agent Status Breathing Indicator
   ══════════════════════════════════════════════ */
.agent-breath {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin-bottom: 8px;
}

.breath-orb {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
}

.breath-orb::before {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid currentColor;
  opacity: 0.3;
  animation: orbBreathe 2s ease-in-out infinite;
}

.breath-orb::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid currentColor;
  opacity: 0.1;
  animation: orbBreathe 2s ease-in-out infinite 0.3s;
}

@keyframes orbBreathe {
  0%, 100% { transform: scale(1); opacity: 0.3; }
  50% { transform: scale(1.15); opacity: 0.1; }
}

.breath-orb.thinking { background: rgba(139,92,246,0.15); color: var(--neon-purple); }
.breath-orb.searching { background: rgba(59,130,246,0.15); color: var(--neon-blue); }
.breath-orb.extracting { background: rgba(16,185,129,0.15); color: var(--neon-green); }
.breath-orb.analyzing { background: rgba(245,158,11,0.15); color: var(--neon-amber); }
.breath-orb.writing { background: rgba(236,72,153,0.15); color: var(--neon-pink); }
.breath-orb.done { background: rgba(16,185,129,0.15); color: var(--neon-green); }
.breath-orb.idle { background: var(--bg-hover); color: var(--text-muted); }

.breath-info {
  flex: 1;
}

.breath-status {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.breath-detail {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* ══════════════════════════════════════════════
   Report Content (Right Panel)
   ══════════════════════════════════════════════ */
.report-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 14px;
  min-height: 0;
}

.report-area::-webkit-scrollbar { width: 4px; }
.report-area::-webkit-scrollbar-track { background: transparent; }
.report-area::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }

.report-empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  padding: 40px 20px;
  text-align: center;
}

.report-empty-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 16px;
}

.report-empty-text {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.6;
}

.report-rendered {
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-secondary);
}

.report-rendered h1 {
  font-size: 22px;
  color: var(--text-primary);
  margin: 20px 0 14px;
  font-weight: 800;
  line-height: 1.3;
  background: linear-gradient(135deg, var(--text-primary), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--glass-border);
}
.report-rendered h2 { font-size: 15px; color: var(--text-primary); margin: 14px 0 8px; font-weight: 600; border-bottom: 1px solid var(--glass-border); padding-bottom: 6px; }
.report-rendered h3 { font-size: 14px; color: var(--text-primary); margin: 12px 0 6px; font-weight: 600; }
.report-rendered p { margin: 6px 0; }
.report-rendered strong { color: var(--text-primary); }
.report-rendered a { color: var(--neon-blue); }
.report-rendered code { font-family: var(--mono); font-size: 12px; background: var(--bg-surface); padding: 1px 5px; border-radius: 3px; }
.report-rendered ul, .report-rendered ol { margin: 6px 0 6px 18px; }
.report-rendered li { margin: 3px 0; }
.report-rendered blockquote { border-left: 3px solid var(--neon-amber); padding: 8px 12px; margin: 8px 0; background: rgba(245,158,11,0.05); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--text-muted); }
.report-rendered table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
.report-rendered th { text-align: left; padding: 6px 10px; border: 1px solid var(--glass-border); background: var(--bg-surface); color: var(--text-primary); font-weight: 600; }
.report-rendered td { padding: 6px 10px; border: 1px solid var(--glass-border); }

.report-actions-bar {
  display: flex;
  gap: 8px;
  padding: 12px 18px;
  border-top: 1px solid var(--glass-border);
}

.report-action-btn {
  padding: 6px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
}

.report-action-btn:hover {
  border-color: var(--neon-purple);
  color: var(--neon-purple);
}

/* ══════════════════════════════════════════════
   History View
   ══════════════════════════════════════════════ */
.history-view {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: 16px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.stat-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 24px; font-weight: 700; color: var(--text-primary); font-family: var(--mono); }
.stat-value.ok { color: var(--neon-green); }
.stat-value.err { color: var(--neon-red); }

.table-wrap {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--glass-border); background: var(--bg-surface); }
td { padding: 10px 16px; border-bottom: 1px solid var(--glass-border); font-size: 13px; color: var(--text-secondary); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg-hover); }

.task-text { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.status-badge-cell { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.status-badge-cell.done { background: rgba(16,185,129,0.12); color: var(--neon-green); }
.status-badge-cell.error, .status-badge-cell.failed { background: rgba(239,68,68,0.12); color: var(--neon-red); }
.status-badge-cell.partial { background: rgba(245,158,11,0.12); color: var(--neon-amber); }
.status-badge-cell.running { background: rgba(59,130,246,0.12); color: var(--neon-blue); }

.action-btn { padding: 4px 12px; border: 1px solid var(--glass-border); border-radius: var(--radius-sm); background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; margin-right: 4px; transition: all 0.15s; font-family: var(--font); }
.action-btn:hover { border-color: var(--neon-purple); color: var(--neon-purple); }
.action-btn.danger:hover { border-color: var(--neon-red); color: var(--neon-red); }

.empty { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 13px; }

/* ══════════════════════════════════════════════
   Detail Modal
   ══════════════════════════════════════════════ */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal { background: var(--bg-base); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); width: 95%; max-width: 1100px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 24px 80px rgba(0,0,0,0.5); }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--glass-border); }
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); transition: all 0.15s; }
.modal-close:hover { color: var(--text-primary); background: var(--bg-hover); }
.modal-body { flex: 1; overflow-y: auto; padding: 24px; }

/* Archive styles */
.archive { width: 100%; }
.archive-section { margin-bottom: 28px; }
.archive-section h3 { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 8px; }
.archive-section h3::before { content: ''; display: inline-block; width: 3px; height: 12px; background: linear-gradient(180deg, var(--neon-purple), var(--neon-blue)); border-radius: 2px; }

.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.info-item { background: var(--bg-surface); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 14px; transition: border-color 0.15s; }
.info-item:hover { border-color: rgba(139,92,246,0.2); }
.info-item .label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
.info-item .value { font-size: 15px; font-weight: 600; color: var(--text-primary); }
.info-item .value.time { font-family: var(--mono); font-size: 13px; }
.info-item .value.status-done { color: var(--neon-green); }
.info-item .value.status-error, .info-item .value.status-failed { color: var(--neon-red); }
.info-item .value.status-partial { color: var(--neon-amber); }

.exec-timeline { position: relative; padding-left: 28px; }
.exec-timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: linear-gradient(180deg, var(--glass-border) 0%, var(--neon-purple) 50%, var(--glass-border) 100%); border-radius: 1px; }
.exec-step { position: relative; margin-bottom: 16px; }
.exec-step::before { content: ''; position: absolute; left: -24px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--neon-purple); border: 2px solid var(--bg-base); box-shadow: 0 0 0 2px rgba(139,92,246,0.2); }
.exec-step-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.exec-step-num { background: rgba(139,92,246,0.12); color: var(--neon-purple); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.exec-step-agent { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.3px; }
.exec-step-agent.Planner { background: rgba(59,130,246,0.12); color: var(--neon-blue); }
.exec-step-agent.Agent { background: rgba(139,92,246,0.12); color: var(--neon-purple); }
.exec-step-agent.Parser { background: rgba(245,158,11,0.12); color: var(--neon-amber); }
.exec-step-agent.Analyst { background: rgba(239,68,68,0.12); color: var(--neon-red); }
.exec-step-agent.Reflection { background: rgba(236,72,153,0.12); color: var(--neon-pink); }
.exec-step-agent.System { background: rgba(82,91,115,0.12); color: var(--text-muted); }
.exec-step-action { font-size: 13px; color: var(--text-primary); font-weight: 500; }
.exec-step-detail { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-family: var(--mono); line-height: 1.5; }
.exec-step-time { font-size: 10px; color: var(--text-dim); margin-left: auto; font-family: var(--mono); }

.source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.source-item { background: var(--bg-surface); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: border-color 0.15s; }
.source-item:hover { border-color: rgba(59,130,246,0.2); }
.source-item .icon { color: var(--text-dim); font-size: 12px; }
.source-item a { color: var(--neon-blue); word-break: break-all; text-decoration: none; font-family: var(--mono); font-size: 11px; }
.source-item a:hover { text-decoration: underline; }

.archive-report { background: var(--bg-surface); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 20px; }
.archive-header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--glass-border); }
.archive-header h2 { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; line-height: 1.4; }
.archive-header .meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }

/* ══════════════════════════════════════════════
   Settings View
   ══════════════════════════════════════════════ */
.settings-view { flex: 1; overflow-y: auto; padding: 28px; max-width: 800px; width: 100%; margin: 0 auto; }
.settings-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 24px; margin-bottom: 16px; backdrop-filter: blur(12px); }
.settings-card h3 { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--glass-border); }
.form-row { margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
.form-input, .form-select { width: 100%; background: var(--bg-surface); border: 1px solid var(--glass-border); border-radius: var(--radius); color: var(--text-primary); padding: 10px 14px; font-size: 13px; font-family: var(--font); outline: none; transition: border-color 0.15s; }
.form-input:focus, .form-select:focus { border-color: var(--neon-purple); box-shadow: 0 0 0 3px rgba(139,92,246,0.1); }
.form-select { cursor: pointer; }
.form-select option { background: var(--bg-surface); color: var(--text-primary); }
.form-hint { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.form-actions { display: flex; gap: 12px; margin-top: 20px; }
.btn-primary { padding: 10px 20px; background: var(--gradient-primary); border: none; border-radius: var(--radius); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: var(--font); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: var(--glow-purple); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-secondary { padding: 10px 20px; background: transparent; border: 1px solid var(--glass-border); border-radius: var(--radius); color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: var(--font); }
.btn-secondary:hover { border-color: var(--neon-purple); color: var(--neon-purple); }
.settings-status { font-size: 12px; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; }
.settings-status.ok { background: rgba(16,185,129,0.08); color: var(--neon-green); border: 1px solid rgba(16,185,129,0.2); }
.settings-status.err { background: rgba(239,68,68,0.08); color: var(--neon-red); border: 1px solid rgba(239,68,68,0.2); }
.provider-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.provider-card { background: var(--bg-surface); border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 12px 16px; cursor: pointer; transition: all 0.15s; text-align: left; }
.provider-card:hover { border-color: rgba(139,92,246,0.2); }
.provider-card.active { border-color: var(--neon-purple); background: rgba(139,92,246,0.06); }
.provider-card .name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.provider-card .url { font-size: 11px; color: var(--text-dim); margin-top: 4px; font-family: var(--mono); }

/* ══════════════════════════════════════════════
   Model Selector Dropdown
   ══════════════════════════════════════════════ */
.model-selector { position: relative; }
.model-overlay { position: fixed; inset: 0; z-index: 200; }
.model-dropdown { position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; z-index: 201; background: var(--bg-elevated); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 -8px 32px rgba(0,0,0,0.4); }
.model-dropdown-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 10px; border-bottom: 1px solid var(--glass-border); }
.model-dropdown-title { font-size: 12px; font-weight: 700; color: var(--text-primary); }
.model-dropdown-hint { font-size: 10px; }
.model-list { max-height: 300px; overflow-y: auto; padding: 6px; }
.model-list::-webkit-scrollbar { width: 3px; }
.model-list::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 2px; }
.model-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.12s; }
.model-item:hover { background: rgba(139,92,246,0.08); }
.model-item.selected { background: rgba(139,92,246,0.12); }
.model-item.locked { opacity: 0.4; cursor: default; }
.model-item.locked:hover { background: transparent; }
.model-item-icon { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.model-item-info { flex: 1; min-width: 0; }
.model-item-name { font-size: 12px; font-weight: 500; color: var(--text-primary); }
.model-item-provider { font-size: 10px; color: var(--text-dim); margin-top: 1px; }
.model-item-badge { padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 600; flex-shrink: 0; }
.model-item-badge.promotion { background: rgba(139,92,246,0.2); color: var(--neon-purple); }
.model-item-badge.subsidy { background: rgba(59,130,246,0.15); color: var(--neon-blue); }
.model-item-rate { font-size: 11px; color: var(--text-muted); font-family: var(--mono); flex-shrink: 0; }
.model-item-check { font-size: 11px; color: var(--neon-purple); flex-shrink: 0; }
.model-item-lock { font-size: 11px; flex-shrink: 0; }
.model-divider { height: 1px; background: var(--glass-border); margin: 4px 6px; }
.model-add-btn { display: flex; align-items: center; gap: 6px; padding: 8px 12px; color: var(--text-muted); font-size: 12px; cursor: pointer; border: none; background: none; width: 100%; font-family: var(--font); transition: all 0.12s; }
.model-add-btn:hover { color: var(--neon-purple); background: rgba(139,92,246,0.06); }

.icon-openai { background: linear-gradient(135deg, #00a67e, #0acf97); color: #fff; }
.icon-deepseek { background: linear-gradient(135deg, #4f6ef7, #6c8cff); color: #fff; }
.icon-qwen { background: linear-gradient(135deg, #ff6a00, #ee9b2a); color: #fff; }
.icon-zhipu { background: linear-gradient(135deg, #7c3aed, #a855f7); color: #fff; }

/* Toast */
.model-toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 300; padding: 10px 20px; border-radius: var(--radius); font-size: 13px; animation: toastIn 0.25s; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
.model-toast.ok { background: rgba(16,185,129,0.15); border: 1px solid var(--neon-green); color: var(--neon-green); }
.model-toast.warn { background: rgba(245,158,11,0.15); border: 1px solid var(--neon-amber); color: var(--neon-amber); }
.model-toast.err { background: rgba(239,68,68,0.15); border: 1px solid var(--neon-red); color: var(--neon-red); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ══════════════════════════════════════════════
   Loading
   ══════════════════════════════════════════════ */
#loader { position: fixed; inset: 0; background: var(--bg-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s; }
#loader .spinner { width: 40px; height: 40px; border: 3px solid var(--glass-border); border-top-color: var(--neon-purple); border-radius: 50%; animation: spin 0.8s linear infinite; }
#loader p { margin-top: 16px; color: var(--text-muted); font-size: 13px; }
#loader.hidden { opacity: 0; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Global scrollbar ── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ── Task input (for workspace) ── */
.task-input-wrap { padding: 16px 18px; border-bottom: 1px solid var(--glass-border); }
.task-input {
  width: 100%;
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  color: var(--text-primary);
  padding: 12px 14px;
  font-size: 13px;
  font-family: var(--font);
  resize: vertical;
  min-height: 80px;
  outline: none;
  line-height: 1.6;
  transition: border-color 0.15s;
}
.task-input:focus { border-color: var(--neon-purple); }
.task-input::placeholder { color: var(--text-dim); }

.task-label { font-size: 11px; color: var(--text-muted); margin: 10px 0 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

.examples { display: flex; flex-direction: column; gap: 4px; }
.example-btn { text-align: left; background: var(--bg-surface); border: 1px solid var(--glass-border); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text-muted); font-size: 11px; cursor: pointer; transition: all 0.15s; font-family: var(--font); line-height: 1.4; }
.example-btn:hover { border-color: var(--neon-purple); color: var(--text-primary); background: rgba(139,92,246,0.06); }

.run-btn {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  background: var(--gradient-primary);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
}
.run-btn:hover { transform: translateY(-1px); box-shadow: var(--glow-purple); }
.run-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

/* Plan list */
.plan-list { margin-top: 12px; }
.plan-step { display: flex; align-items: flex-start; gap: 6px; padding: 5px 0; font-size: 11px; transition: all 0.2s; }
.plan-step .num { color: var(--neon-purple); font-weight: 700; min-width: 16px; font-family: var(--mono); font-size: 10px; }
.plan-step .txt { color: var(--text-muted); line-height: 1.4; }
.plan-step .status-icon { min-width: 14px; font-size: 11px; text-align: center; }
.plan-step.status-done { opacity: 0.5; }
.plan-step.status-done .num { color: var(--neon-green); }
.plan-step.status-running { background: rgba(139,92,246,0.08); border-radius: var(--radius-sm); padding: 4px 6px; margin: 0 -6px; }
.plan-step.status-running .num { color: var(--neon-purple); animation: breathe 1.5s infinite; }
.plan-step.status-skipped { opacity: 0.3; text-decoration: line-through; }

/* Timeline empty */
.timeline-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-size: 13px; text-align: center; gap: 12px; }
.timeline-empty-icon { font-size: 32px; opacity: 0.3; }

/* ══════════════════════════════════════════════
   Hero Welcome — Premium Idle State
   ══════════════════════════════════════════════ */
.hero-welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  position: relative;
  overflow: hidden;
}

.hero-welcome::before {
  content: '';
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(139,92,246,0.08) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: heroPulse 4s ease-in-out infinite;
  pointer-events: none;
}

.hero-welcome::after {
  content: '';
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,0.06) 0%, transparent 70%);
  top: 40%;
  left: 55%;
  transform: translate(-50%, -50%);
  animation: heroPulse 4s ease-in-out infinite 1.5s;
  pointer-events: none;
}

@keyframes heroPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
  50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
}

.hero-orb {
  width: 72px;
  height: 72px;
  border-radius: 24px;
  background: var(--gradient-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: 24px;
  position: relative;
  z-index: 1;
  box-shadow: 0 0 40px rgba(139,92,246,0.3), 0 0 80px rgba(139,92,246,0.1);
  animation: orbFloat 3s ease-in-out infinite;
}

.hero-orb::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 28px;
  background: var(--gradient-primary);
  opacity: 0.2;
  filter: blur(12px);
  animation: orbFloat 3s ease-in-out infinite 0.5s;
}

@keyframes orbFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.hero-title {
  font-size: 26px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--neon-purple) 50%, var(--neon-blue) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  position: relative;
  z-index: 1;
  letter-spacing: -0.5px;
}

.hero-subtitle {
  font-size: 14px;
  color: var(--text-muted);
  text-align: center;
  margin-bottom: 32px;
  position: relative;
  z-index: 1;
  max-width: 420px;
  line-height: 1.6;
}

.hero-input-area {
  width: 100%;
  max-width: 560px;
  position: relative;
  z-index: 1;
}

.hero-textarea-wrap {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xl);
  padding: 16px 20px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: all 0.25s;
}

.hero-textarea-wrap:focus-within {
  border-color: var(--neon-purple);
  box-shadow: 0 0 0 4px rgba(139,92,246,0.1), var(--glow-purple);
}

.hero-textarea {
  width: 100%;
  background: none;
  border: none;
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font);
  resize: none;
  outline: none;
  min-height: 60px;
  max-height: 160px;
  line-height: 1.6;
}

.hero-textarea::placeholder { color: var(--text-dim); }

.hero-input-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
}

.hero-hint {
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 4px;
}

.hero-hint kbd {
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-muted);
}

.hero-run-btn {
  padding: 10px 24px;
  background: var(--gradient-primary);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
  display: flex;
  align-items: center;
  gap: 8px;
}

.hero-run-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--glow-purple);
}

.hero-run-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.hero-examples {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.hero-example-btn {
  padding: 8px 14px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 99px;
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
  backdrop-filter: blur(8px);
  max-width: 260px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hero-example-btn:hover {
  border-color: var(--neon-purple);
  color: var(--neon-purple);
  background: rgba(139,92,246,0.06);
  transform: translateY(-1px);
}

/* ══════════════════════════════════════════════
   Multi-turn Chat — Active Task
   ══════════════════════════════════════════════ */
.chat-msg-list {
  padding: 0 28px 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 120px;
  overflow-y: auto;
}

.chat-msg {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 12px;
  border-radius: var(--radius);
  animation: msgIn 0.25s ease;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.chat-msg.user {
  background: rgba(139,92,246,0.08);
  border: 1px solid rgba(139,92,246,0.15);
}

.chat-msg.system {
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
}

.chat-msg-avatar {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
}

.chat-msg.user .chat-msg-avatar {
  background: var(--gradient-primary);
  color: #fff;
}

.chat-msg.system .chat-msg-avatar {
  background: var(--bg-hover);
  color: var(--text-muted);
}

.chat-msg-text {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  flex: 1;
}

.chat-msg-time {
  font-size: 10px;

<script type="text/babel" data-cache="false">

const { useState, useRef, useEffect, useCallback, useMemo } = React;

// ── API Helper ──
async function safeFetch(url, options) {
  try {
    const resp = await fetch(url, options);
    if (!resp.ok) {
      const text = await resp.text().catch(() => '');
      return { error: true, status: resp.status, message: text || `HTTP ${resp.status}` };
    }
    return await resp.json();
  } catch (e) {
    return { error: true, message: e.message || 'Network error' };
  }
}
async function fetchTasks(limit=50, offset=0) {
  return safeFetch(`/api/tasks?limit=${limit}&offset=${offset}`);
}
async function fetchTask(id) {
  return safeFetch(`/api/tasks/${id}`);
}
async function deleteTask(id) {
  return safeFetch(`/api/tasks/${id}`, { method: 'DELETE' });
}
async function clearAllTasks() {
  return safeFetch('/api/tasks', { method: 'DELETE' });
}
async function fetchSettings() {
  return safeFetch('/api/settings');
}
async function fetchPresets() {
  return safeFetch('/api/settings/presets');
}
async function saveSettings(data) {
  return safeFetch('/api/settings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  });
}
async function resetSettings() {
  return safeFetch('/api/settings/reset', {method: 'POST'});
}
// HTML sanitize helper (XSS protection)
function safeHtml(markdownText) {
  const raw = marked.parse(markdownText || '');
  return typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(raw) : raw;
}

// ══════════════════════════════════════════════
//  Utility Functions
// ══════════════════════════════════════════════

function parseAgentState(logs) {
  let phase = 'idle';
  let pageCount = 0;
  let infoCount = 0;
  let totalSteps = 0;
  let currentStep = 0;
  const visitedUrls = new Set();

  for (const log of logs) {
    const action = log.action || '';
    const agent = log.agent || '';
    const detail = log.detail || '';
    const text = action + ' ' + detail;

    if (action === 'plan') {
      phase = 'thinking';
      try { const planData = JSON.parse(detail); totalSteps = planData.length; } catch (e) {}
    }
    if (text.includes('拆解') || text.includes('计划') || text.includes('plan') || (agent === 'Planner' && text.includes('思考'))) {
      phase = 'thinking';
    }
    if (text.includes('搜索') || text.includes('search') || text.includes('打开') || text.includes('open_page') || text.includes('浏览') || text.includes('访问') || text.includes('goto') || text.includes('http')) {
      phase = 'searching';
    }
    const urlMatches = detail.match(/https?:\/\/[^\s"'\}]+/g);
    if (urlMatches) {
      for (const url of urlMatches) {
        const cleanUrl = url.replace(/[\",\}\]$]/, '');
        if (cleanUrl.length > 10 && !visitedUrls.has(cleanUrl)) {
          visitedUrls.add(cleanUrl);
          pageCount++;
          phase = 'searching';
        }
      }
    }
    if ((text.includes('search') || text.includes('搜索')) && !urlMatches) { pageCount++; }
    if (text.includes('提取') || text.includes('extract') || text.includes('解析') || text.includes('parse')) {
      phase = 'extracting';
      infoCount++;
    }
    if (text.includes('反思') || text.includes('reflect') || text.includes('评估') || text.includes('可信度') || text.includes('check')) {
      phase = 'analyzing';
    }
    if (text.includes('报告') || text.includes('总结') || text.includes('生成') || text.includes('report') || text.includes('finish')) {
      phase = 'writing';
    }
    if (text.includes('完成') || text.includes('结束') || text.includes('done') || text.includes('finish')) {
      phase = 'done';
    }
    if (agent === 'System' && (action === '任务开始' || action.includes('start'))) {
      phase = 'thinking';
    }
  }

  if (totalSteps === 0) totalSteps = Math.max(5, Math.floor(logs.length / 3) + 3);
  currentStep = Math.min(pageCount + infoCount + 1, totalSteps);

  return { phase, pageCount, infoCount, totalSteps, currentStep };
}

function allReflections(logs) {
  const out = [];
  for (const l of logs) {
    if (!l || l.agent !== 'Reflection' || l.action !== '反思结果') continue;
    if (l._reflection) { out.push(l._reflection); continue; }
    if (l.detail) { try { out.push(JSON.parse(l.detail)); } catch (e) {} }
  }
  return out;
}

function reflectionData(log) {
  if (!log || log.agent !== 'Reflection' || log.action !== '反思结果') return null;
  if (log._reflection) return log._reflection;
  if (log.detail) { try { return JSON.parse(log.detail); } catch (e) { return null; } }
  return null;
}

// ── 可复用的 Reflection 卡片组件 ──
function ReflectionCard({ r, showDecision, onDecision, time }) {
  return (
    <div className="reflection-card">
      <div className="refl-header">
        <div className="refl-brand">
          <div className="refl-icon">🧠</div>
          <span className="refl-label">REFLECTION{r.success ? ' ✓' : ''}</span>
        </div>
        <span className={`refl-score ${r.success ? 'success' : ''}`}>{r.score}%</span>
        {time && <span className="exec-step-time">{time}</span>}
      </div>
      <div className="refl-body">
        {r.reason && <div className="refl-reason">{r.reason}</div>}
        {r.missing && r.missing.length > 0 && (
          <div className="refl-missing">⚠ 缺失：{r.missing.join('、')}</div>
        )}
        {r.next_action && <div className="refl-next">→ 下一步：{r.next_action}</div>}
        {!showDecision && <div className="refl-bar"><div className="refl-bar-fill" style={{width: `${r.score}%`}}></div></div>}
      </div>
      {showDecision && onDecision && (
        <div className="refl-decision">
          <button className="refl-btn continue" onClick={() => onDecision('continue')}>▶ 继续执行</button>
          <button className="refl-btn stop" onClick={() => onDecision('stop')}>■ 结束任务</button>
        </div>
      )}
    </div>
  );
}

// Infer timeline node type from log
function inferNodeType(log) {
  const agent = log.agent || '';
  const action = log.action || '';
  const detail = log.detail || '';
  const text = action + ' ' + detail;

  if (agent === 'Reflection') return 'reflecting';
  if (agent === 'Analyst') return 'analyzing';
  if (text.includes('搜索') || text.includes('search') || text.includes('打开') || text.includes('open_page') || text.includes('http')) return 'searching';
  if (text.includes('提取') || text.includes('extract') || text.includes('解析') || text.includes('parse')) return 'extracting';
  if (text.includes('思考') || text.includes('think') || text.includes('计划') || text.includes('plan') || text.includes('拆解')) return 'thinking';
  if (text.includes('报告') || text.includes('report') || text.includes('总结') || text.includes('finish')) return 'analyzing';
  return 'system';
}

const nodeTypeLabels = {
  thinking: 'AI Brain',
  searching: 'Search Agent',
  extracting: 'Extract Agent',
  analyzing: 'Analysis',
  reflecting: 'Reflection',
  system: 'System',
};

const nodeTypeIcons = {

  searching: '🔍',
  extracting: '📄',
  analyzing: '📊',
  reflecting: '💡',
  system: '⚙',
};

const phaseStatusMap = {
  idle: { icon: '○', label: '待机中', detail: '等待任务启动' },
  thinking: { icon: '●', label: 'Thinking', detail: 'AI 正在推理与规划' },
  searching: { icon: '●', label: 'Searching', detail: '搜索网络信息' },
  extracting: { icon: '●', label: 'Reading', detail: '提取网页内容' },
  analyzing: { icon: '●', label: 'Reasoning', detail: '分析与反思' },
  writing: { icon: '●', label: 'Writing', detail: '生成最终报告' },

};

// ══════════════════════════════════════════════
//  Model Selector
// ══════════════════════════════════════════════

function ModelSelector() {
  const [open, setOpen] = useState(false);
  const [presets, setPresets] = useState({});
  const [config, setConfig] = useState({llm_provider:'', llm_model:'', has_api_key:false});
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    Promise.all([fetchSettings(), fetchPresets()]).then(([cfg, pre]) => {
      setConfig(cfg);
      setPresets(pre);
    });
  }, []);

  useEffect(() => {
    if (toast) {
      const t = setTimeout(() => setToast(null), 3000);
      return () => clearTimeout(t);
    }
  }, [toast]);

  const providerLabels = {openai:'OpenAI',deepseek:'DeepSeek',qwen:'通义千问',zhipu:'智谱 AI'};
  const providerIcons = {openai:'O',deepseek:'D',qwen:'Q',zhipu:'Z'};
  const iconClasses = {openai:'icon-openai',deepseek:'icon-deepseek',qwen:'icon-qwen',zhipu:'icon-zhipu'};
  const providerBadges = {
    deepseek:{model:'deepseek-chat',text:'热门',cls:'promotion'},
    qwen:{model:'qwen-plus',text:'推荐',cls:'subsidy'},
  };
  const multipliers = {
    'gpt-4o-mini':'0.15x','deepseek-chat':'0.32x','qwen-plus':'0.40x',
    'glm-4-flash':'0.05x','glm-4-air':'0.12x','qwen-turbo':'0.25x',
    'gpt-3.5-turbo':'0.10x','deepseek-reasoner':'0.55x','qwen-coder-plus':'0.35x',
    'gpt-4o':'1.00x','gpt-4-turbo':'1.25x','glm-4-plus':'0.50x','glm-4-9b':'0.08x',
  };

  const configuredProvider = config.has_api_key ? config.llm_provider : null;
  const currentProviderLabel = providerLabels[config.llm_provider] || config.llm_provider;

  const allModels = [];
  for (const [key, preset] of Object.entries(presets)) {
    for (const model of (preset.models || [])) {
      const isCurrent = config.llm_provider === key && config.llm_model === model;
      const isConfigured = key === configuredProvider;
      allModels.push({
        providerKey: key, providerLabel: providerLabels[key] || key,
        icon: providerIcons[key] || '?', iconClass: iconClasses[key] || '',
        name: model,
        badge: providerBadges[key] && providerBadges[key].model === model ? providerBadges[key] : null,
        rate: multipliers[model] || '—', selected: isCurrent, configured: isConfigured,
        locked: !isConfigured && !isCurrent,
      });
    }
  }

  const currentModel = allModels.find(m => m.selected) || null;
  const groupOrder = [config.llm_provider, ...Object.keys(presets).filter(k => k !== config.llm_provider)];
  const grouped = {};
  for (const m of allModels) {
    if (!grouped[m.providerKey]) grouped[m.providerKey] = [];
    grouped[m.providerKey].push(m);
  }

  const handleSelect = async (model) => {
    if (model.selected) { setOpen(false); return; }
    if (model.locked) {
      setOpen(false);
      setToast({message: `「${model.name}」需要先配置 ${model.providerLabel} 的 API Key`, type:'warn'});
      return;
    }
    setSaving(true);
    const payload = {
      llm_provider: model.providerKey, llm_model: model.name,
      llm_base_url: (presets[model.providerKey] || {}).base_url || '',
    };
    const res = await saveSettings(payload);
    if (res.ok) {
      setConfig(prev => ({...prev, llm_provider: model.providerKey, llm_model: model.name}));
      setToast({message: `已切换到 ${model.name}`, type:'ok'});
    } else {
      setToast({message: '切换失败', type:'err'});
    }
    setSaving(false);
    setOpen(false);
  };

  return (
    <div className="model-selector">
      {toast && <div className={`model-toast ${toast.type}`}>{toast.message}</div>}
      <div className="sidebar-model" onClick={() => setOpen(!open)}>
        <span className={`model-dot ${config.has_api_key ? '' : 'unconfigured'}`}></span>
        <div className="model-info">
          <div className="model-name">{currentModel ? currentModel.name : '加载中...'}</div>
          <div className="model-provider">{currentProviderLabel}{config.has_api_key ? ' · 已配置' : ' · 未配置'}</div>
        </div>
        <span style={{fontSize:10,color:'var(--text-dim)'}}>▲</span>
      </div>

      {open && (
        <>
          <div className="model-overlay" onClick={() => setOpen(false)} />
          <div className="model-dropdown">
            <div className="model-dropdown-header">
              <span className="model-dropdown-title">选择模型</span>
              {configuredProvider ? (
                <span className="model-dropdown-hint" style={{color:'var(--neon-green)'}}>✓ {currentProviderLabel}</span>
              ) : (
                <span className="model-dropdown-hint" style={{color:'var(--neon-red)'}}>未配置 API Key</span>
              )}
            </div>
            <div className="model-list">
              {groupOrder.map(key => {
                const models = grouped[key];
                if (!models) return null;
                return (
                  <div key={key}>
                    <div style={{padding:'6px 10px 4px',fontSize:10,color:'var(--text-dim)',fontWeight:700,textTransform:'uppercase',letterSpacing:'1px'}}>
                      {providerLabels[key] || key}
                      {key === configuredProvider && <span style={{color:'var(--neon-green)',marginLeft:6,fontWeight:400,textTransform:'none'}}>✓</span>}
                    </div>
                    {models.map((m) => (
                      <div key={`${m.providerKey}-${m.name}`}
                        className={`model-item ${m.selected ? 'selected' : ''} ${m.locked ? 'locked' : ''}`}
                        onClick={() => handleSelect(m)}>
                        <span className={`model-item-icon ${m.iconClass}`}>{m.icon}</span>
                        <div className="model-item-info">
                          <div className="model-item-name">{m.name}</div>
                          {m.locked && <div className="model-item-provider" style={{color:'var(--neon-red)'}}>需要 API Key</div>}
                        </div>
                        {m.badge && <span className={`model-item-badge ${m.badge.cls}`}>{m.badge.text}</span>}
                        {m.locked ? <span className="model-item-lock">🔒</span> : <span className="model-item-rate">{m.rate}</span>}
                        {m.selected && <span className="model-item-check">✓</span>}
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

            <div className="sidebar-task-title">{t.task}</div>
            <div className="sidebar-task-meta">
              <span className="sidebar-task-dot" style={{background: t.status === 'done' ? 'var(--neon-green)' : t.status === 'error' ? 'var(--neon-red)' : 'var(--neon-amber)'}}></span>
              {t.status} · {t.created_at?.replace('T',' ').slice(0,16) || ''}
            </div>
          </div>
        ))}
      </div>

      <ModelSelector />
    </div>
  );
}
