function HeroWelcome({ onRun, running }) {
  const [task, setTask] = useState('');
  const textareaRef = useRef(null);
  const examples = [
    '搜索 Python 最流行的 Web 框架，找到排名前 3 的项目',
    '分析 AI 视频生成工具市场，比较 Runway、Pika 和 Sora',
    '找出 5 个最值得学习的 AI Agent 开源项目',
    '调研 2024 年最热门的 SaaS 创业方向',
  ];

  const handleSubmit = () => {
    if (task.trim() && !running) onRun(task);
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      handleSubmit();
    }
  };

  return (
    <div className="hero-welcome view-fade-in">
      <div className="hero-orb">🧠</div>
      <div className="hero-title">What should I research?</div>
      <div className="hero-subtitle">
        描述你的研究任务，AI Agent 将自主搜索、分析、反思并生成完整报告
      </div>
      <div className="hero-input-area">
        <div className="hero-textarea-wrap">
          <textarea
            ref={textareaRef}
            className="hero-textarea"
            placeholder="例如：分析 Runway AI 的定价、用户评价和市场表现，与 Pika AI 和 Sora 对比..."
            value={task}
            onChange={e => setTask(e.target.value)}
            onKeyDown={handleKeyDown}
            disabled={running}
            rows={3}
            autoFocus
          />
          <div className="hero-input-footer">
            <span className="hero-hint">
              <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 提交
            </span>
            <button className="hero-run-btn" onClick={handleSubmit} disabled={running || !task.trim()}>
              <span>▶</span>
              <span>{running ? '执行中...' : '开始研究'}</span>
            </button>
          </div>
        </div>
      </div>
      <div className="hero-examples">
        {examples.map((ex, i) => (
          <button key={i} className="hero-example-btn" onClick={() => { setTask(ex); textareaRef.current?.focus(); }} disabled={running}>
            {ex}
          </button>
        ))}
      </div>
    </div>
  );
}

function TaskHeader({ task, logs, running, status, planSteps }) {
  const { phase, pageCount, infoCount, totalSteps, currentStep } = parseAgentState(logs);
  const ps = phaseStatusMap[phase] || phaseStatusMap.idle;

  // Improved progress: prefer plan_steps completion ratio
  let progress = 0;
  if (status === 'done' || status === 'partial') {
    progress = 100;
  } else if (planSteps.length > 0) {
    const doneCount = planSteps.filter(s => s.status === 'done').length;
    const runningCount = planSteps.filter(s => s.status === 'running').length;
    progress = Math.round(((doneCount + runningCount * 0.5) / planSteps.length) * 100);
    progress = Math.min(95, Math.max(5, progress));
  } else if (logs.length > 0) {
    progress = Math.min(90, Math.round((currentStep / Math.max(totalSteps, 1)) * 100));
  }

  const currentStage = ps.detail;
  const iteration = planSteps.length > 0
    ? `${planSteps.filter(s => s.status === 'done').length}/${planSteps.length}`
    : `${Math.min(logs.length, totalSteps)}/${totalSteps}`;

  return (
    <div className="task-header">
      <div className="task-title">{task || '等待新任务...'}</div>
      <div className="task-meta-row">
        <div className="task-progress-wrap">
          <div className="task-progress-bar">
            <div className="task-progress-fill" style={{width: `${progress}%`}}></div>
          </div>
        </div>
        <div className="task-meta-chips">
          <div className={`meta-chip ${running ? 'active' : ''}`}>
            <span className="chip-icon">{ps.icon}</span>
            {currentStage}
          </div>
          <div className="meta-chip">
            <span className="chip-icon">◈</span>
            {iteration}
          </div>
          <div className="meta-chip">
            <span className="chip-icon">🌐</span>
            {pageCount} pages
          </div>
          <div className="meta-chip">
            <span className="chip-icon">📄</span>
            {infoCount} info
          </div>
        </div>
      </div>
    </div>
  );
}

function AgentTimeline(props) {
  const { logs, running, decidedRefIdx, onDecision } = props;
  const containerRef = useRef(null);
  const [expandedCards, setExpandedCards] = useState(new Set());

  const reflections = allReflections(logs);

  useEffect(() => {
    if (containerRef.current) {
      containerRef.current.scrollTop = containerRef.current.scrollHeight;
    }
  }, [logs]);

  // 当出现决策按钮时，自动滚动到该卡片
  useEffect(() => {
    const hasDecision = running && reflections.length > 0 && reflections.length - 1 > decidedRefIdx;
    if (hasDecision && containerRef.current) {
      // 延迟确保 DOM 已更新
      setTimeout(() => {
        const decisionCard = containerRef.current.querySelector('.refl-decision');
        if (decisionCard) {
          decisionCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 300);
    }
  }, [running, reflections.length, decidedRefIdx]);

  // 预计算 log 索引 → reflection 索引映射（避免 O(n²) 重复遍历）
  const refIndexMap = (() => {
    const map = {};
    let refCount = 0;
    for (let i = 0; i < logs.length; i++) {
      if (logs[i]?.agent === 'Reflection' && logs[i]?.action === '反思结果') {
        map[i] = refCount++;
      }
    }
    return map;
  })();

  const toggleCard = (idx) => {
    setExpandedCards(prev => {
      const next = new Set(prev);
      if (next.has(idx)) next.delete(idx); else next.add(idx);
      return next;
    });
  };

  return (
    <div className="timeline-area" ref={containerRef}>
      {logs.length === 0 && !running ? (
        <div className="timeline-empty">
          <div className="timeline-empty-icon">◈</div>
          <div>AI Agent 等待指令</div>
          <div style={{fontSize:11,color:'var(--text-dim)'}}>执行过程将在此实时展示</div>
        </div>
      ) : (
        <div className="timeline-spine">
          {logs.map((log, i) => {
            const r = reflectionData(log);
            if (r) {
              const refIdx = refIndexMap[i] ?? 0;
              const isLatest = refIdx === reflections.length - 1;
              const showDecision = running && isLatest && refIdx > decidedRefIdx;
              return (
                <div key={`ref-${i}`} className="tl-node">
                  <div className={`tl-dot reflecting`}></div>
                  <div className={isLatest ? 'latest' : ''} style={{width:'100%'}}>
                    <ReflectionCard r={r} showDecision={showDecision} onDecision={onDecision} />
                  </div>
                </div>
              );
            }

            const nodeType = inferNodeType(log);
            const isExpanded = expandedCards.has(i);
            const hasLongDetail = log.detail && log.detail.length > 120;

            return (
              <div key={i} className="tl-node">
                <div className={`tl-dot ${nodeType}`}></div>
                <div
                  className={`tl-card ${hasLongDetail ? 'expandable' : ''} ${isExpanded ? 'tl-card-expanded' : hasLongDetail ? 'tl-card-collapsed' : ''}`}
                  onClick={hasLongDetail ? () => toggleCard(i) : undefined}
                  style={{position:'relative',paddingLeft:'21px'}}
                >
                  <div className={`tl-card-border ${nodeType}`}></div>
                  <div className="tl-card-head">
                    <span className={`tl-agent-badge ${nodeType}`}>
                      {nodeTypeIcons[nodeType]} {nodeTypeLabels[nodeType]}
                    </span>
                    <span className="tl-time">{log.time || ''}</span>
                  </div>
                  <div className="tl-action">{log.action}</div>
                  {log.detail && <div className="tl-detail">{log.detail}</div>}
                  {hasLongDetail && (
                    <div style={{fontSize:10,color:'var(--text-dim)',marginTop:4,cursor:'pointer'}}>
                      {isExpanded ? '▲ 收起' : '▼ 展开详情'}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ChatInput({ running, chatMessages, onSendMessage, onQuickAction, taskDone }) {
  const [msg, setMsg] = useState('');
  const listRef = useRef(null);

  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [chatMessages]);

  const handleSend = () => {
    if (!msg.trim()) return;
    if (onSendMessage) onSendMessage(msg);
    setMsg('');
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      handleSend();
    }
  };

  const quickActions = taskDone
    ? [
        { label: '🔄 继续深入研究', action: 'continue_research' },
        { label: '📊 重新生成报告', action: 'regenerate_report' },
        { label: '🔍 补充缺失信息', action: 'add_missing_info' },
      ]
    : [
        { label: '🧭 调整研究方向', action: 'adjust_direction' },
        { label: '📎 补充缺失信息', action: 'add_missing_info' },
        { label: '📝 立即生成报告', action: 'generate_report' },
        { label: '⏭ 跳过当前步骤', action: 'skip_step' },
      ];

  return (
    <div className="chat-input-area">
      {chatMessages && chatMessages.length > 0 && (
        <div className="chat-msg-list" ref={listRef}>
          {chatMessages.map((m, i) => (
            <div key={i} className={`chat-msg ${m.role}`}>
              <div className="chat-msg-avatar">{m.role === 'user' ? 'U' : 'AI'}</div>
              <div className="chat-msg-text">{m.text}</div>
              <div className="chat-msg-time">{m.time || ''}</div>
            </div>
          ))}
        </div>
      )}
      <div className="chat-input-wrap">
        <textarea
          className="chat-input"
          placeholder={taskDone ? '输入后续问题，或开始新任务...' : running ? '向 AI Agent 发送追加指令...' : '向 AI Agent 发送指令...'}
          value={msg}
          onChange={e => setMsg(e.target.value)}
          onKeyDown={handleKeyDown}
          rows={1}
        />
        <button className="chat-send-btn" onClick={handleSend} disabled={!msg.trim()}>↑</button>
      </div>
      <div className="quick-actions">
        {quickActions.map((qa, i) => (
          <button
            key={i}
            className="quick-action-btn"
            onClick={() => onQuickAction && onQuickAction(qa.action)}
            disabled={taskDone && qa.action === 'skip_step'}
          >
            {qa.label}
          </button>
        ))}
      </div>
    </div>
  );
}

function IntelPanel({ logs, running, status, report, visitedPages: vp, infoCount: ic }) {
  const { phase, pageCount, infoCount, totalSteps, currentStep } = parseAgentState(logs);
  const ps = phaseStatusMap[phase] || phaseStatusMap.idle;
  const panelRef = useRef(null);
  const reportAreaRef = useRef(null);
  const [isDragging, setIsDragging] = useState(false);
  const [isReportDragging, setIsReportDragging] = useState(false);
  const [sectionHeights, setSectionHeights] = useState({});
  const sectionResizeRef = useRef(null);

  // 拖拽调整面板宽度
  useEffect(() => {
    if (!isDragging) return;
    const handleMove = (e) => {
      if (!panelRef.current) return;
      const newWidth = window.innerWidth - e.clientX;
      const clamped = Math.max(240, Math.min(newWidth, window.innerWidth * 0.6));
      panelRef.current.style.width = clamped + 'px';
    };
    const handleUp = () => {
      setIsDragging(false);
      document.body.classList.remove('resizing-panel');
    };
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseup', handleUp);
    return () => {
      document.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseup', handleUp);
    };
  }, [isDragging]);

  // 拖拽调整报告区域高度
  useEffect(() => {
    if (!isReportDragging) return;
    const handleMove = (e) => {
      if (!reportAreaRef.current || !panelRef.current) return;
      const panelRect = panelRef.current.getBoundingClientRect();
      const newHeight = panelRect.bottom - e.clientY;
      const clamped = Math.max(150, Math.min(newHeight, panelRect.height - 60));
      reportAreaRef.current.style.height = clamped + 'px';
      reportAreaRef.current.style.flex = 'none';
    };
    const handleUp = () => {
      setIsReportDragging(false);
      document.body.classList.remove('resizing-report');
    };
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseup', handleUp);
    return () => {
      document.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseup', handleUp);
    };
  }, [isReportDragging]);

  // 拖拽调整 section 高度
  useEffect(() => {
    if (!sectionResizeRef.current) return;
    const { sectionIdx, startY, startHeight } = sectionResizeRef.current;
    const handleMove = (e) => {
      const delta = e.clientY - startY;
      const newHeight = Math.max(40, startHeight + delta);
      setSectionHeights(prev => ({ ...prev, [sectionIdx]: newHeight }));
    };
    const handleUp = () => {
      sectionResizeRef.current = null;
      document.body.classList.remove('resizing-section');
      document.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseup', handleUp);
    };
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('mouseup', handleUp);
    return () => {
      document.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseup', handleUp);
    };
  }, [sectionResizeRef.current]);

  const startSectionDrag = (idx, e) => {
    const section = e.target.closest('.intel-section');
    if (!section) return;
    sectionResizeRef.current = {
      sectionIdx: idx,
      startY: e.clientY,
      startHeight: section.getBoundingClientRect().height
    };
    document.body.classList.add('resizing-section');
  };

  const startDrag = () => {
    setIsDragging(true);
    document.body.classList.add('resizing-panel');
  };

  const startReportDrag = () => {
    setIsReportDragging(true);
    document.body.classList.add('resizing-report');
  };

  // Extract visited URLs from logs
  const visitedUrls = [];
  const urlSet = new Set();
  for (const log of logs) {
    const matches = (log.detail || '').match(/https?:\/\/[^\s"'\}]+/g);
    if (matches) {
      for (const url of matches) {
        const clean = url.replace(/[\",\}\]$]/, '');
        if (clean.length > 10 && !urlSet.has(clean)) {
          urlSet.add(clean);
          try {
            const domain = new URL(clean).hostname;
            visitedUrls.push({ url: clean, domain });
          } catch (e) {}
        }
      }
    }
  }

  // Report generation stages
  const reportStages = [
    { label: 'Collecting sources', done: pageCount > 0 || status === 'done' },
    { label: 'Comparing facts', done: infoCount > 1 || status === 'done' },
    { label: 'Detecting conflicts', done: infoCount > 2 || status === 'done' },
    { label: 'Writing analysis', done: phase === 'writing' || phase === 'done' },
    { label: 'Generating report', done: !!report },
  ];
  const activeStageIdx = reportStages.findIndex(s => !s.done);

  return (
    <div className="intel-panel-wrapper">
      <div className={`intel-resize-handle ${isDragging ? 'active' : ''}`} onMouseDown={startDrag}></div>
      <div className="intel-panel" ref={panelRef}>
      {/* Agent Breathing Status */}
      <div className="intel-section" style={sectionHeights[0] ? {height: sectionHeights[0], overflow: 'auto'} : {}}>
        <div className="intel-section-title"><span className="dot"></span>Agent Status</div>
        <div className="agent-breath">
          <div className={`breath-orb ${phase}`}>
            {nodeTypeIcons[phase] || '○'}
          </div>
          <div className="breath-info">
            <div className="breath-status">{ps.label}</div>
            <div className="breath-detail">{ps.detail}</div>
          </div>
        </div>
        <div className="overview-grid">
          <div className={`overview-item ${phase === 'searching' ? 'active' : ''}`}>
            <div className="overview-label">Pages</div>
            <div className="overview-value">{pageCount}<span>个</span></div>
          </div>
          <div className={`overview-item ${phase === 'extracting' ? 'active' : ''}`}>
            <div className="overview-label">Info</div>
            <div className="overview-value">{infoCount}<span>条</span></div>
          </div>
          <div className={`overview-item ${running ? 'active' : ''}`}>
            <div className="overview-label">Progress</div>
            <div className="overview-value">{currentStep}<span>/{totalSteps}</span></div>
          </div>
          <div className={`overview-item ${logs.length > 0 ? 'active' : ''}`}>
            <div className="overview-label">Steps</div>
            <div className="overview-value">{logs.length}<span>步</span></div>
          </div>
        </div>
      </div>
      <div className={`section-resize-handle ${sectionResizeRef.current?.sectionIdx === 0 ? 'active' : ''}`} onMouseDown={(e) => startSectionDrag(0, e)}></div>

      {/* Task Tree */}
      <div className="intel-section" style={sectionHeights[1] ? {height: sectionHeights[1], overflow: 'auto'} : {}}>
        <div className="intel-section-title"><span className="dot"></span>Task Structure</div>
        <div className="task-tree">
          {[
            { label: '信息收集', done: pageCount > 0, running: phase === 'searching' },
            { label: '内容提取', done: infoCount > 0, running: phase === 'extracting' },
            { label: '分析推理', done: phase === 'analyzing' || phase === 'done', running: phase === 'analyzing' },
            { label: '报告生成', done: !!report, running: phase === 'writing' },
          ].map((item, i) => (
            <div key={i} className={`tree-item ${item.done ? 'done' : ''} ${item.running ? 'running' : ''}`}>
              <span className={`tree-icon ${item.done ? 'done' : item.running ? 'running' : 'pending'}`}>
                {item.done ? '✓' : item.running ? '●' : '○'}
              </span>
              <span>{item.label}</span>
              {item.done && <span style={{marginLeft:'auto',fontSize:10,color:'var(--neon-green)'}}>完成</span>}
              {item.running && <span style={{marginLeft:'auto',fontSize:10,color:'var(--neon-purple)'}}>进行中</span>}
            </div>
          ))}
        </div>
      </div>
      <div className={`section-resize-handle ${sectionResizeRef.current?.sectionIdx === 1 ? 'active' : ''}`} onMouseDown={(e) => startSectionDrag(1, e)}></div>

      {/* Report Generation Process */}
      {(running || report) && (
        <div className="intel-section" style={sectionHeights[2] ? {height: sectionHeights[2], overflow: 'auto'} : {}}>
          <div className="intel-section-title"><span className="dot"></span>Report Pipeline</div>
          <div className="report-gen">
            {reportStages.map((stage, i) => {
              const isActive = i === activeStageIdx && running;
              const isDone = stage.done && !isActive;
              return (
                <div key={i} className="report-gen-step">
                  <div className={`rg-icon ${isDone ? 'done' : isActive ? 'active' : 'waiting'}`}>
                    {isDone ? '✓' : isActive ? '◉' : '○'}
                  </div>
                  <span className={`rg-text ${isDone ? 'done' : isActive ? 'active' : ''}`}>
                    {stage.label}{isActive ? '...' : ''}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {visitedUrls.length > 0 && <div className={`section-resize-handle ${sectionResizeRef.current?.sectionIdx === 2 ? 'active' : ''}`} onMouseDown={(e) => startSectionDrag(2, e)}></div>}

      {/* Data Sources */}
      {visitedUrls.length > 0 && (
        <div className="intel-section" style={sectionHeights[3] ? {height: sectionHeights[3], overflow: 'auto'} : {}}>
          <div className="intel-section-title"><span className="dot"></span>Data Sources ({visitedUrls.length})</div>
          <div className="source-list">
            {visitedUrls.slice(0, 10).map((s, i) => (
              <a key={i} className="source-chip" href={s.url} target="_blank" rel="noopener noreferrer">
                <span className="source-favicon">{s.domain[0]?.toUpperCase()}</span>
                <span className="source-domain">{s.domain}</span>
              </a>
            ))}
          </div>
        </div>
      )}

      {/* Report Resize Handle */}
      <div className={`report-resize-handle ${isReportDragging ? 'active' : ''}`} onMouseDown={startReportDrag}></div>

      {/* Report Area */}
      <div className="report-area" ref={reportAreaRef}>
        {!report ? (
          <div className="report-empty-state">
            <div className="report-empty-icon">📋</div>
            <div className="report-empty-text">
              {running ? 'Agent 正在工作中...<br/>报告将在此处实时生成' : '报告将在这里展示'}
            </div>
          </div>
        ) : (
          <div>
            <div className="report-rendered" dangerouslySetInnerHTML={{__html: safeHtml(report)}} />
          </div>
        )}
      </div>

      {report && (
        <div className="report-actions-bar">
          <button className="report-action-btn" onClick={() => {
            const blob = new Blob([report], {type:'text/markdown'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'browsermind-report.md';
            a.click();
            URL.revokeObjectURL(url);
          }}>📥 下载报告</button>
          <button className="report-action-btn" onClick={() => {
            navigator.clipboard.writeText(report).catch(() => {});
          }}>📋 复制内容</button>
        </div>
      )}
      </div>
    </div>
  );
}

      <div className="stat-card"><div className="stat-label">失败</div><div className="stat-value err">{errors}</div></div>

function TaskDetail({ taskId, onClose }) {
  const [task, setTask] = useState(null);
  useEffect(() => { fetchTask(taskId).then(setTask); }, [taskId]);

  if (!task) return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-body"><div className="empty">加载中...</div></div>
      </div>
    </div>
  );

  const reportHtml = task.final_report ? safeHtml(task.final_report) : '';
  const fmtDuration = (s) => {
    if (s === null || s === undefined) return '-';
    if (s < 60) return `${s}秒`;
    const m = Math.floor(s / 60);
    const rem = s % 60;
    if (m < 60) return rem > 0 ? `${m}分${rem}秒` : `${m}分`;
    const h = Math.floor(m / 60);
    const remM = m % 60;
    return remM > 0 ? `${h}时${remM}分` : `${h}时`;
  };

  const statusMap = { done:'已完成', error:'出错', failed:'未能完成', partial:'部分完成', running:'执行中' };

  const buildSteps = () => {
    const steps = [];
    const logs = task.logs || [];
    const startLog = logs.find(l => l.agent === 'System' && l.action === '任务开始');
    steps.push({ agent:'System', action:'任务启动', detail: startLog ? startLog.detail : '', time: startLog ? startLog.time : '', num: 1 });

    if (task.plan && task.plan.length > 0) {
      steps.push({ agent:'Planner', action:'生成任务计划', detail:`共 ${task.plan.length} 个步骤`, time:'', num: 2 });
      task.plan.forEach((p) => {
        const agentMap = { search:'Agent', browse:'Agent', extract:'Parser', analyze:'Analyst' };
        steps.push({ agent: agentMap[p.type] || 'Agent', action:`${p.type}: ${p.goal || ''}`, detail:'', time:'', num: null });
      });
    }

    const skipActions = new Set(['思考', 'plan', '任务开始', '任务结束', '']);
    logs.forEach((log) => {
      if (skipActions.has(log.action)) return;
      if (log.agent === 'Reflection' && log.action === '反思结果') {
        const r = reflectionData(log);
        if (r) steps.push({ agent:'Reflection', action:'反思结果', detail:'', time: log.time, num: null, _reflection: r });
        return;
      }
      const isKey = log.action.includes('调用工具') || log.action.includes('工具结果') || log.action.includes('提取') ||
        log.action.includes('报告') || log.action.includes('完成') || log.action.includes('失败') ||
        log.action.includes('评估') || log.action.includes('拆解');
      if (!isKey) return;
      steps.push({ agent: log.agent, action: log.action, detail: log.detail, time: log.time, num: null });
    });

    const endLog = logs.slice().reverse().find(l => l.agent === 'System' && l.action === '任务结束');
    if (endLog) steps.push({ agent:'System', action:'任务结束', detail: endLog.detail, time: endLog.time, num: null });

    let counter = 0;
    steps.forEach((s) => { if (s.num) counter = s.num; else s.num = ++counter; });
    return steps;
  };

  const execSteps = buildSteps();

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <span className="modal-title">任务 #{task.id}</span>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          <div className="archive">
            <div className="archive-header">
              <h2>{task.task}</h2>
              <div className="meta">
                <span className={`status-badge-cell ${task.status}`}>{statusMap[task.status] || task.status}</span>
                <span>创建于 {task.created_at?.replace('T',' ').slice(0,19)}</span>
                <span>耗时 {fmtDuration(task.duration_seconds)}</span>
              </div>
            </div>

            <div className="archive-section">
              <h3>基本信息</h3>
              <div className="info-grid">
                <div className="info-item"><span className="label">创建时间</span><span className="value time">{task.created_at?.replace('T',' ').slice(0,19) || '-'}</span></div>
                <div className="info-item"><span className="label">执行耗时</span><span className="value">{fmtDuration(task.duration_seconds)}</span></div>
                <div className="info-item"><span className="label">状态</span><span className={`value status-${task.status}`}>{statusMap[task.status] || task.status}</span></div>
                <div className="info-item"><span className="label">访问页面</span><span className="value">{task.visited_pages?.length || 0} 个</span></div>
                <div className="info-item"><span className="label">提取信息</span><span className="value">{task.extracted_info?.length || 0} 条</span></div>
                <div className="info-item"><span className="label">日志</span><span className="value">{task.logs?.length || 0} 条</span></div>
              </div>
            </div>

            <div className="archive-section">
              <h3>Agent 执行轨迹</h3>
              {execSteps.length > 0 ? (
                <div className="exec-timeline">
                  {execSteps.map((step, i) => {
                    if (step._reflection) {
                      return (
                        <div key={i} className="exec-step">
                          <ReflectionCard r={step._reflection} time={step.time} />
                        </div>
                      );
                    }
                    return (
                      <div key={i} className="exec-step">
                        <div className="exec-step-header">
                          <span className="exec-step-num">Step {step.num}</span>
                          <span className={`exec-step-agent ${step.agent}`}>{step.agent}</span>
                          <span className="exec-step-action">{step.action}</span>
                          {step.time && <span className="exec-step-time">{step.time}</span>}
                        </div>
                        {step.detail && <div className="exec-step-detail">{step.detail}</div>}
                      </div>
                    );
                  })}
                </div>
              ) : <div className="empty">无执行记录</div>}
            </div>

            <div className="archive-section">
              <h3>数据来源</h3>
              {task.visited_pages?.length > 0 ? (
                <div className="source-grid">
                  {task.visited_pages.map((url, i) => (
                    <div key={i} className="source-item">
                      <span className="icon">[ link ]</span>
                      <a href={url} target="_blank" rel="noopener noreferrer">{url}</a>
                    </div>
                  ))}
                </div>
              ) : <div className="empty">未访问任何页面</div>}
            </div>

            <div className="archive-section">
              <h3>最终报告</h3>
              {task.final_report ? (
                <div className="archive-report">
                  <div className="report-rendered" dangerouslySetInnerHTML={{__html: reportHtml}} />
                </div>
              ) : <div className="empty">无报告</div>}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function HistoryView({ onTasksChanged }) {
  const [tasks, setTasks] = useState([]);
  const [total, setTotal] = useState(0);
  const [viewId, setViewId] = useState(null);
  const [clearing, setClearing] = useState(false);

  const load = useCallback(async () => {
    const data = await fetchTasks();
    setTasks(data.tasks || []);
    setTotal(data.total || 0);
  }, []);

  useEffect(() => { load(); }, [load]);

  const handleDelete = async (id) => {
    if (!confirm('确认删除此任务记录？')) return;
    await deleteTask(id);
    load();
    if (onTasksChanged) onTasksChanged();
  };

  const handleClearAll = async () => {
    if (!confirm('确认清空所有历史记录？此操作不可恢复。')) return;
    setClearing(true);
    const res = await clearAllTasks();
    setClearing(false);
    if (res.ok || res.deleted !== undefined) {
      setTasks([]);
      setTotal(0);
      if (onTasksChanged) onTasksChanged();
    }
  };

  return (
    <div className="history-view">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <h2 style={{fontSize:18,fontWeight:700,color:'var(--text-primary)'}}>任务历史</h2>
        <div style={{display:'flex',gap:8}}>
          <button className="action-btn" onClick={load}>刷新</button>
          <button className="action-btn" onClick={handleClearAll} disabled={clearing || total === 0}
            style={{color: total > 0 ? 'var(--neon-red)' : 'var(--text-dim)', borderColor: total > 0 ? 'rgba(255,75,75,0.3)' : 'var(--border-default)', opacity: total === 0 ? 0.5 : 1}}>
            {clearing ? '清空中...' : '一键清空'}
          </button>
        </div>
      </div>
      <Stats tasks={tasks} total={total} />
      <TaskTable tasks={tasks} onView={setViewId} onDelete={handleDelete} />
      {viewId && <TaskDetail taskId={viewId} onClose={() => setViewId(null)} />}
    </div>
  );
}

function SettingsView() {
  const [config, setConfig] = useState({llm_provider:'', llm_model:'', llm_base_url:'', has_api_key:false});
  const [presets, setPresets] = useState({});
  const [provider, setProvider] = useState('');
  const [model, setModel] = useState('');
  const [baseUrl, setBaseUrl] = useState('');
  const [apiKey, setApiKey] = useState('');
  const [status, setStatus] = useState(null);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    Promise.all([fetchSettings(), fetchPresets()]).then(([cfg, pre]) => {
      setConfig(cfg); setPresets(pre);
      setProvider(cfg.llm_provider || 'openai');
      setModel(cfg.llm_model || '');
      setBaseUrl(cfg.llm_base_url || '');
    });
  }, []);

  const handleSelectProvider = (key) => {
    setProvider(key);
    const p = presets[key];
    if (p) { setBaseUrl(p.base_url); setModel(p.models[0] || ''); }
  };

  const handleSave = async () => {
    setSaving(true);
    const payload = {llm_provider: provider, llm_model: model, llm_base_url: baseUrl};
    if (apiKey.trim()) payload.llm_api_key = apiKey.trim();
    const res = await saveSettings(payload);
    setSaving(false);
    if (res.ok) { setStatus({type:'ok', message:'配置已保存并立即生效'}); setConfig(prev => ({...prev, ...res.settings, has_api_key: true})); setApiKey(''); }
    else { setStatus({type:'err', message: res.error || '保存失败'}); }
    setTimeout(() => setStatus(null), 3000);
  };

  const handleReset = async () => {
    if (!confirm('确定重置为默认配置？')) return;
    const res = await resetSettings();
    if (res.ok) {
      setStatus({type:'ok', message:'已重置为默认配置'});
      const cfg = await fetchSettings();
      setConfig(cfg); setProvider(cfg.llm_provider || 'openai'); setModel(cfg.llm_model || ''); setBaseUrl(cfg.llm_base_url || ''); setApiKey('');
    } else { setStatus({type:'err', message: '重置失败'}); }
    setTimeout(() => setStatus(null), 3000);
  };

  const currentPreset = presets[provider] || {};
  const modelOptions = currentPreset.models || [];

  return (
    <div className="settings-view">
      <h2 style={{fontSize:18,fontWeight:700,marginBottom:20,color:'var(--text-primary)'}}>AI 模型设置</h2>
      {status && <div className={`settings-status ${status.type}`}>{status.message}</div>}
      <div className="settings-card">
        <h3>供应商选择</h3>
        <div className="provider-grid">
          {Object.entries(presets).map(([key, p]) => (
            <button key={key} className={`provider-card ${provider===key?'active':''}`} onClick={() => handleSelectProvider(key)}>
              <div className="name">{p.label}</div>
              <div className="url">{p.base_url}</div>
            </button>
          ))}
        </div>
      </div>
      <div className="settings-card">
        <h3>模型配置</h3>
        <div className="form-row">
          <label className="form-label">供应商</label>
          <input className="form-input" value={currentPreset.label || provider} disabled />
        </div>
        <div className="form-row">
          <label className="form-label">模型</label>
          {modelOptions.length > 0 ? (
            <select className="form-select" value={model} onChange={e=>setModel(e.target.value)}>
              {modelOptions.map(m => <option key={m} value={m}>{m}</option>)}
            </select>
          ) : (
            <input className="form-input" value={model} onChange={e=>setModel(e.target.value)} placeholder="输入模型名称" />
          )}
        </div>
        <div className="form-row">
          <label className="form-label">API Base URL</label>
          <input className="form-input" value={baseUrl} onChange={e=>setBaseUrl(e.target.value)} placeholder="https://..." />
          <div className="form-hint">选择供应商时会自动填充</div>
        </div>
        <div className="form-row">
          <label className="form-label">API Key {config.has_api_key && <span style={{color:'var(--neon-green)'}}>(已配置)</span>}</label>
          <input className="form-input" type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
            placeholder={config.has_api_key ? '输入新 Key 以替换' : '输入 API Key'} />
          <div className="form-hint">Key 仅保存在本地</div>
        </div>
        <div className="form-actions">
          <button className="btn-primary" onClick={handleSave} disabled={saving}>{saving ? '保存中...' : '保存配置'}</button>
          <button className="btn-secondary" onClick={handleReset}>重置为默认</button>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════
//  MAIN APP
// ══════════════════════════════════════════════

function App() {
  const [view, setView] = useState('workbench');
  const [logs, setLogs] = useState([]);
  const [report, setReport] = useState('');
  const [status, setStatus] = useState('idle');
  const [plan, setPlan] = useState([]);
  const [planSteps, setPlanSteps] = useState([]);
  const [visitedPages, setVisitedPages] = useState(0);
  const [infoCount, setInfoCount] = useState(0);
  const [decidedRefIdx, setDecidedRefIdx] = useState(-1);
  const [currentTask, setCurrentTask] = useState('');
  const [taskHistory, setTaskHistory] = useState([]);
  const [chatMessages, setChatMessages] = useState([]);
  const wsRef = useRef(null);
  const wsClosedRef = useRef(false);  // WebSocket 是否已主动关闭

  const running = status === 'running';

  // Load task history for sidebar
  useEffect(() => {
    fetchTasks(10, 0).then(data => setTaskHistory(data.tasks || []));
  }, [status]);

  const handleRun = useCallback((task) => {
    if (!task.trim()) return;
    setCurrentTask(task);
    setLogs([]); setReport(''); setPlan([]); setPlanSteps([]); setVisitedPages(0); setInfoCount(0);
    setDecidedRefIdx(-1); setChatMessages([]);
    setStatus('running');
    wsClosedRef.current = false;

    // 关闭旧的 WebSocket（如果有）
    if (wsRef.current) {
      try { wsRef.current.close(); } catch(e) {}
      wsRef.current = null;
    }

    let wsHost = location.host;
    if (!wsHost || location.protocol === 'file:') wsHost = 'localhost:8000';
    const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${wsProtocol}//${wsHost}/api/agent/stream`);
    wsRef.current = ws;

    ws.onopen = () => { ws.send(JSON.stringify({ task })); };

    ws.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch(e) { return; }
      if (msg.type === 'log') {
        setLogs(prev => [...prev, msg.data]);
      } else if (msg.type === 'plan') {
        setPlan(msg.data || []);
      } else if (msg.type === 'plan_steps') {
        setPlanSteps(msg.data || []);
      } else if (msg.type === 'reflection') {
        setLogs(prev => [...prev, {
          agent: 'Reflection', action: '反思结果', detail: '',
          time: new Date().toLocaleTimeString('zh-CN',{hour12:false}), _reflection: msg.data,
        }]);
      } else if (msg.type === 'done') {
        // 任务完成：更新状态，但不关闭 WebSocket（保持连接以支持追加提问）
        setReport(msg.data.final_report || '');
        setStatus(msg.data.status || 'done');
        setVisitedPages((msg.data.visited_pages || []).length);
        setInfoCount((msg.data.extracted_info || []).length);
        if (msg.data.plan) setPlan(msg.data.plan);
        const now = new Date().toLocaleTimeString('zh-CN',{hour12:false});
        setChatMessages(prev => [...prev, { role: 'system', text: `任务完成（${msg.data.status || 'done'}），可继续追加提问`, time: now }]);
      } else if (msg.type === 'error') {
        setStatus('error');
        setLogs(prev => [...prev, {agent:'System', action:'错误', detail: msg.message, time: new Date().toLocaleTimeString('zh-CN',{hour12:false})}]);
        ws.close();
      }
    };

    ws.onerror = () => { setStatus('error'); };
    ws.onclose = () => {
      wsClosedRef.current = true;
      setStatus(prev => prev === 'running' ? 'done' : prev);
    };
  }, []);

  const handleDecision = useCallback((decision) => {
    if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
      wsRef.current.send(JSON.stringify({ type: 'decision', decision }));
    }
    setDecidedRefIdx(prev => prev + 1);
  }, []);

  // Multi-turn: send follow-up message during/after task
  const handleSendMessage = useCallback((text) => {
    const now = new Date().toLocaleTimeString('zh-CN',{hour12:false});
    setChatMessages(prev => [...prev, { role: 'user', text, time: now }]);

    // 检查 WebSocket 是否真正可用
    const ws = wsRef.current;
    const wsOpen = ws && ws.readyState === 1 /* OPEN */ && !wsClosedRef.current;

    if (wsOpen) {
      try {
        ws.send(JSON.stringify({ type: 'instruction', text }));
        setStatus('running');  // 切回运行状态
        setLogs([]);           // 清空时间线，展示新一轮执行过程
        setPlan([]);           // 清理旧计划
        setPlanSteps([]);      // 清理旧计划步骤
        setReport('');         // 清理旧报告
        setChatMessages(prev => [...prev, { role: 'system', text: '追加指令已发送，Agent 正在处理...', time: now }]);
      } catch (e) {
        // WebSocket 发送失败（连接已断）→ 标记关闭，降级为全新任务
        console.warn('[BrowserMind] WebSocket send failed, starting new task:', e.message);
        wsClosedRef.current = true;
        handleRun(text);
      }
    } else {
      // WebSocket 已断开 → 启动全新任务
      console.log('[BrowserMind] WebSocket not open (ws=%s, closed=%s), starting new task', ws ? ws.readyState : 'null', wsClosedRef.current);
      handleRun(text);
    }
  }, [handleRun]);

  // Quick action buttons
  const handleQuickAction = useCallback((action) => {
    const actionMap = {
      'adjust_direction': '请调整当前研究方向，尝试从不同角度分析',
      'add_missing_info': '请补充之前缺失的信息，重新搜索不完整的数据',
      'generate_report': '请立即根据已收集的信息生成最终报告',
      'skip_step': '请跳过当前步骤，继续执行下一个计划步骤',
      'continue_research': '请在现有报告基础上继续深入研究',
      'regenerate_report': '请重新生成报告，改进结构和内容',
    };
    const text = actionMap[action] || action;
    handleSendMessage(text);
  }, [handleSendMessage]);

  const handleNewTask = () => {
    setView('workbench');
    // 关闭旧的 WebSocket 连接
    if (wsRef.current) {
      try { wsRef.current.close(); } catch(e) {}
      wsRef.current = null;
    }
    wsClosedRef.current = true;
    setLogs([]); setReport(''); setPlan([]); setPlanSteps([]);
    setStatus('idle'); setCurrentTask(''); setChatMessages([]);
  };

  // 从侧边栏点击历史任务 → 加载到工作台，支持继续提问
  const handleResumeTask = useCallback(async (taskItem) => {
    // 关闭旧的 WebSocket 连接
    if (wsRef.current) {
      try { wsRef.current.close(); } catch(e) {}
      wsRef.current = null;
    }
    wsClosedRef.current = true;

    // 加载完整任务数据
    const detail = await fetchTask(taskItem.id);
    if (!detail || detail.error) return;

    setCurrentTask(detail.task || taskItem.task);
    setLogs(detail.logs || []);
    setReport(detail.final_report || '');
    setPlan(detail.plan || []);
    setPlanSteps([]);
    setVisitedPages(detail.visited_pages?.length || 0);
    setInfoCount(detail.extracted_info?.length || 0);
    setDecidedRefIdx(-1);
    setStatus('done');
    setChatMessages([{ role: 'system', text: `已加载历史任务（${detail.status || taskItem.status}），可在下方输入框继续提问`, time: new Date().toLocaleTimeString('zh-CN',{hour12:false}) }]);
    setView('workbench');
  }, []);

  // Placeholder views
  const PlaceholderView = ({ title, icon, desc }) => (
    <div className="history-view view-fade-in" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      <div style={{fontSize:48,marginBottom:16,opacity:0.3}}>{icon}</div>
      <h2 style={{fontSize:18,fontWeight:700,color:'var(--text-primary)',marginBottom:8}}>{title}</h2>
      <p style={{fontSize:13,color:'var(--text-muted)',textAlign:'center',maxWidth:400,lineHeight:1.6}}>{desc}</p>
    </div>
  );

  return (
    <div className="app">
      <Sidebar view={view} onView={setView} onNewTask={handleNewTask} onTaskSelect={handleResumeTask} running={running} logs={logs} taskHistory={taskHistory} />
      {(view === 'workbench' || view === 'running') && (
        <div className="view-fade-in" style={{display:'contents'}}>
          <Workbench
            logs={logs}
            report={report}
            status={status}
            plan={plan}
            planSteps={planSteps}
            visitedPages={visitedPages}
            infoCount={infoCount}
            running={running}
            onRun={handleRun}
            decidedRefIdx={decidedRefIdx}
            onDecision={handleDecision}
            currentTask={currentTask}
            chatMessages={chatMessages}
            onSendMessage={handleSendMessage}
            onQuickAction={handleQuickAction}
          />
        </div>
      )}
      {view === 'history' && <HistoryView onTasksChanged={() => fetchTasks(10, 0).then(data => setTaskHistory(data.tasks || []))} />}
      {view === 'knowledge' && <PlaceholderView title="知识库" icon="📚" desc="将收集到的研究数据、网页内容自动归档到知识库中，支持语义搜索和引用。此功能即将上线。" />}
      {view === 'sources' && <PlaceholderView title="数据源管理" icon="🌐" desc="配置和管理 AI Agent 可访问的数据源，包括搜索引擎、网站白名单、API 数据接口等。此功能即将上线。" />}
      {view === 'settings' && <SettingsView />}
    </div>
  );
}

// ── Mount ──
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Hide loader
window.addEventListener('load', () => {
  setTimeout(() => {
    const loader = document.getElementById('loader');
    if (loader) loader.classList.add('hidden');
  }, 300);
});
</script>
