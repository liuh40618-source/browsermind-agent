<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrowserMind | 研究工作台</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('bm-theme')||'light';}catch(e){}</script>
<link rel="stylesheet" href="/static/workspace.css">
<script defer src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script defer src="/static/workspace.js"></script>
</head>
<body>
<header class="nav">
<a class="brand" href="/"><span class="brand-mark"><i data-lucide="scan-eye"></i></span>BrowserMind<span class="edition">WORKSPACE</span></a>
<nav class="tabs" aria-label="主导航"><button class="tab active" id="tab-work" aria-current="page" onclick="switchView('work')"><i data-lucide="panels-top-left"></i>工作台</button><button class="tab" id="tab-gallery" onclick="switchView('gallery')"><i data-lucide="history"></i>任务历史</button></nav>
<div class="nav-actions"><span class="connection" id="connection">连接中</span><button class="icon-btn" id="theme-btn" title="切换主题" aria-label="切换主题" onclick="toggleTheme()"><i data-lucide="moon"></i></button><button class="icon-btn" title="设置" aria-label="设置" onclick="openSettings()"><i data-lucide="settings-2"></i></button></div>
</header>
<main>
<div class="notice" id="apibanner" hidden><i data-lucide="key-round"></i><span id="api-message">当前模型尚未配置 API Key</span><button class="text-btn" onclick="openSettings()">打开设置<i data-lucide="arrow-right"></i></button></div>
<section id="view-work" class="view">
<div class="workspace-heading"><div><span class="eyebrow">RESEARCH / 研究</span><h1>研究工作台</h1></div><div class="heading-meta"><span class="badge" id="status-pill">就绪</span><span class="duration" id="duration">00:00</span></div></div>
<div class="workbench">
<aside class="task-column">
<div class="section-head"><h2><i data-lucide="square-pen"></i>研究任务</h2><span class="section-index">01</span></div>
<div class="task-content"><label class="sr-only" for="task-input">研究任务</label><textarea id="task-input" maxlength="12000" placeholder="你想研究什么？例如：调研开源 Agent 框架，对比能力、限制与适用场景。"></textarea><div class="composer-footer"><span id="task-count">0 字</span><span class="model-name" id="model-name">读取模型中</span></div><div class="run-actions"><button class="btn primary" id="run-btn" onclick="runTask()"><i data-lucide="play"></i>开始研究</button><button class="btn danger" id="stop-btn" hidden onclick="stopTask()"><i data-lucide="square"></i>停止</button></div>
<div class="examples" id="chips"><span class="eyebrow">研究模板</span><button onclick="useExample(0)"><i data-lucide="git-compare-arrows"></i>产品对比<i data-lucide="arrow-up-right"></i></button><button onclick="useExample(1)"><i data-lucide="library-big"></i>开源项目调研<i data-lucide="arrow-up-right"></i></button><button onclick="useExample(2)"><i data-lucide="chart-no-axes-combined"></i>行业趋势<i data-lucide="arrow-up-right"></i></button></div></div>
<div class="section-head plan-head"><h2><i data-lucide="list-checks"></i>执行计划</h2><span class="count" id="plan-count">0 / 0</span></div><ol class="stepper" id="stepper"><li class="muted-empty">暂无执行计划</li></ol>
</aside>
<section class="activity-column" aria-label="执行过程">
<div class="section-head"><h2><i data-lucide="activity"></i>执行记录</h2><span class="count" id="log-count">0 条</span></div>
<div class="stages" id="stages" aria-label="研究阶段"><span data-stage="plan"><i data-lucide="route"></i>规划</span><span data-stage="browse"><i data-lucide="globe"></i>浏览</span><span data-stage="parse"><i data-lucide="text-search"></i>解析</span><span data-stage="reflect"><i data-lucide="circle-check"></i>校验</span><span data-stage="analyze"><i data-lucide="file-pen-line"></i>报告</span></div><div class="progress" id="progress" hidden></div>
<div class="timeline scroll-area" id="timeline" role="log" aria-label="实时执行记录" aria-live="polite"><div class="empty-state" id="activity-empty"><div class="empty-symbol"><i data-lucide="radar"></i></div><h3>等待开始研究</h3><span>暂无执行记录</span></div></div>
<div class="decision" id="decision" hidden><div class="decision-title"><i data-lucide="circle-help"></i>需要你的判断<span id="decision-score"></span></div><p id="decision-reason"></p><div class="decision-actions"><button class="btn primary" onclick="decide('continue')">继续研究</button><button class="btn" onclick="showInstruct()">调整方向</button><button class="text-btn" onclick="decide('stop')">生成报告</button></div><form id="instruct" class="inline-composer" hidden onsubmit="event.preventDefault();sendInstruct()"><input id="instruct-input" aria-label="调整方向" maxlength="12000" placeholder="补充研究要求"><button class="icon-btn" title="发送调整" aria-label="发送调整"><i data-lucide="arrow-up"></i></button></form></div>
<form class="followup inline-composer" id="followup" hidden onsubmit="event.preventDefault();sendFollow()"><input id="follow-input" aria-label="追加研究要求" maxlength="12000" placeholder="继续追问，补充研究要求"><button class="icon-btn" title="发送追问" aria-label="发送追问"><i data-lucide="arrow-up"></i></button></form>
<div class="activity-footer"><span id="activity-status">尚未开始</span><button class="text-btn" title="查看最新记录" onclick="scrollToLatest()">最新记录<i data-lucide="arrow-down"></i></button></div>
</section>
<section class="report-column" aria-label="研究报告"><div class="section-head"><h2><i data-lucide="file-text"></i>研究报告</h2><div class="report-actions" id="report-actions" hidden><button class="icon-btn" id="regen-btn" title="重新生成报告" aria-label="重新生成报告" onclick="regenerateReport()"><i data-lucide="refresh-cw"></i></button><button class="icon-btn" title="复制报告" aria-label="复制报告" onclick="copyReport()"><i data-lucide="copy"></i></button><button class="icon-btn" title="下载 Markdown" aria-label="下载 Markdown" onclick="downloadReport()"><i data-lucide="download"></i></button></div></div><div class="report-meta" id="report-meta">尚无报告</div>
<div class="report-body scroll-area"><div class="empty-state" id="report-empty"><div class="document-visual" aria-hidden="true"><i data-lucide="file-search"></i><span></span><span></span><span></span><div><b></b><b></b><b></b></div></div><h3>研究成果，汇于此处</h3><span>等待研究结果</span></div><article class="markdown" id="report" hidden></article><section class="sources" id="sources" hidden><h3>访问来源</h3><div id="source-list"></div></section></div></section>
</div></section>
<section id="view-gallery" class="view history-view" hidden><div class="workspace-heading"><div><span class="eyebrow">LIBRARY / 资料库</span><h1>任务历史</h1></div><span class="muted" id="hist-count"></span></div><div class="history-toolbar"><div class="search-field"><i data-lucide="search"></i><input id="history-search" type="search" aria-label="搜索任务" placeholder="搜索任务或报告" oninput="scheduleHistorySearch()"></div><select id="history-status" aria-label="筛选任务状态" onchange="loadGallery(0)"><option value="">全部状态</option><option value="done">已完成</option><option value="partial">部分完成</option><option value="cancelled">已停止</option><option value="error">执行出错</option><option value="failed">未完成</option></select><button class="icon-btn" title="刷新历史" aria-label="刷新历史" onclick="loadGallery(historyOffset)"><i data-lucide="refresh-cw"></i></button><button class="text-btn danger-text clear-history" onclick="confirmClearAll()"><i data-lucide="trash-2"></i>清空历史</button></div>
<div class="history-table"><div class="history-labels"><span>研究任务</span><span>状态</span><span>创建时间</span><span>耗时</span><span></span></div><div id="gallery"></div></div><div class="pagination"><span id="page-label"></span><button class="icon-btn" id="prev-page" title="上一页" aria-label="上一页" onclick="loadGallery(historyOffset-20)"><i data-lucide="chevron-left"></i></button><button class="icon-btn" id="next-page" title="下一页" aria-label="下一页" onclick="loadGallery(historyOffset+20)"><i data-lucide="chevron-right"></i></button></div></section>
</main>
<dialog class="settings-dialog" id="settings" aria-labelledby="settings-title"><div class="dialog-head"><h2 id="settings-title">模型与连接</h2><button class="icon-btn" title="关闭设置" aria-label="关闭设置" onclick="closeSettings()"><i data-lucide="x"></i></button></div><form id="settings-form" onsubmit="event.preventDefault();saveSettings()"><div class="field" id="auth-field" hidden><label for="set-token">访问令牌</label><div class="inline-composer"><input id="set-token" type="password" autocomplete="off" placeholder="AUTH_TOKEN"><button type="button" class="btn" onclick="connectAuth()">连接</button></div></div><div class="field"><label for="set-provider">模型供应商</label><select id="set-provider" onchange="onProviderChange()"><option value="openai">OpenAI</option><option value="deepseek">DeepSeek</option><option value="qwen">通义千问</option><option value="zhipu">智谱 AI</option></select></div><div class="field"><label for="set-model">模型名称</label><input id="set-model" list="model-options" required placeholder="模型 ID"><datalist id="model-options"></datalist></div><div class="field"><label for="set-base">API 地址</label><input id="set-base" type="url" placeholder="https://api.example.com/v1"></div><div class="field"><label for="set-key">API Key<span id="key-state"></span></label><input id="set-key" type="password" autocomplete="new-password" placeholder="保留现有密钥"></div><div class="field"><label for="set-tavily">Tavily Key<span class="muted">可选</span></label><input id="set-tavily" type="password" autocomplete="new-password" placeholder="保留现有配置"></div><p id="settings-error" class="form-error" role="alert" hidden></p><div class="dialog-footer"><button class="text-btn" type="button" onclick="resetSettings()">恢复默认</button><button class="btn primary" type="submit" id="save-settings"><i data-lucide="check"></i>保存设置</button></div></form></dialog>
<dialog class="report-dialog" id="drawer" aria-labelledby="drawer-title"><div class="dialog-head"><h2 id="drawer-title">报告详情</h2><button class="icon-btn" title="下载此报告" aria-label="下载此报告" onclick="downloadHistoryReport()"><i data-lucide="download"></i></button><button class="icon-btn" title="关闭报告" aria-label="关闭报告" onclick="closeDrawer()"><i data-lucide="x"></i></button></div><div class="drawer-body"><div id="drawer-meta" class="muted"></div><article id="drawer-report" class="markdown"></article></div></dialog>
<dialog class="confirm-dialog" id="confirm-mask" aria-labelledby="confirm-title"><h2 id="confirm-title">确认操作</h2><p id="confirm-msg"></p><div class="dialog-footer"><button class="btn" onclick="closeConfirm()">取消</button><button class="btn danger" onclick="doConfirm()">确认</button></div></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
